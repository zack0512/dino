<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沙沙dino jump game 🎮</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f7f7f7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      color: #535353;
      transition: background-color 0.5s, color 0.5s;
    }
    body.night {
      background-color: #202124;
      color: #e8eaed;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      padding: 20px;
    }
    canvas {
      background-color: transparent;
      display: block;
      margin: 0 auto;
      max-width: 100%;
      cursor: pointer;
    }
    #ui-panel {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 15px;
      font-weight: bold;
    }
    #controls-info {
      font-size: 13px;
      line-height: 1.6;
    }
    #leaderboard-box {
      background: rgba(0, 0, 0, 0.05);
      padding: 12px 16px;
      border-radius: 8px;
      min-width: 230px;
      font-size: 13px;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
    }
    body.night #leaderboard-box {
      background: rgba(255, 255, 255, 0.08);
    }
    #leaderboard-box h4 {
      margin-bottom: 6px;
      border-bottom: 2px dashed currentColor;
      padding-bottom: 4px;
    }
    #leaderboard-list {
      list-style: none;
    }
    #leaderboard-list li {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
    }
    #name-modal {
      display: none;
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      color: #333;
      padding: 25px;
      border: 3px solid #535353;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      text-align: center;
      z-index: 10;
    }
    body.night #name-modal {
      background: #2b2c2f;
      color: #fff;
      border-color: #e8eaed;
    }
    #name-modal input {
      padding: 10px;
      margin: 12px 0;
      font-size: 16px;
      font-family: inherit;
      width: 80%;
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
      user-select: text;
    }
    #name-modal button {
      padding: 9px 20px;
      font-size: 14px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      background: #535353;
      color: #fff;
      border: none;
      border-radius: 6px;
    }
    body.night #name-modal button {
      background: #e8eaed;
      color: #202124;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="800" height="250"></canvas>
  
  <div id="ui-panel">
    <div id="controls-info">
      <p>🎮 操作指南：</p>
      <p>• [Space] / [↑] / 點擊螢幕：跳躍 / 重新開始</p>
      <p>• [↓] 按住：蹲下避開高空飛鳥</p>
    </div>
    <div id="leaderboard-box">
      <h4>🏆 全域前 10 名排行榜</h4>
      <ol id="leaderboard-list">
        <li>載入中...</li>
      </ol>
    </div>
  </div>

  <div id="name-modal">
    <h3>🎉 榮登高分榜！</h3>
    <p>請輸入您的名字紀錄戰績：</p>
    <input type="text" id="player-name-input" maxlength="10" placeholder="您的名字">
    <br>
    <button id="submit-name-btn">確認送出</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBZ9s5Ku8aEzaVEmk_7ztbIiHXI6qmz5H0",
    authDomain: "my-project-zack0512.firebaseapp.com",
    databaseURL: "https://my-project-zack0512-default-rtdb.firebaseio.com",
    projectId: "my-project-zack0512",
    storageBucket: "my-project-zack0512.firebasestorage.app",
    messagingSenderId: "972310414233",
    appId: "1:972310414233:web:4014908a1e187754530908",
    measurementId: "G-YKEN22N04Y"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const leaderboardRef = ref(db, 'leaderboard');

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const nameModal = document.getElementById('name-modal');
  const nameInput = document.getElementById('player-name-input');
  const submitBtn = document.getElementById('submit-name-btn');
  const leaderboardList = document.getElementById('leaderboard-list');

  let gameState = 'START';
  let score = 0;
  let highScore = 0;
  let globalScores = [];
  let currentSpeed = 6;
  const initialSpeed = 6;
  const maxSpeed = 22;
  let isNight = false;
  let frameCount = 0;

  function isModalOpen() {
    return nameModal.style.display === 'block' || document.activeElement === nameInput;
  }

  // ==========================================
  // 1. 雙層視差背景：遠景城市建築 + 雲朵 + 起伏地形
  // ==========================================
  const groundOffset = 210;

  // 遠景城市建築剪影 (視差層 1：移動最慢)
  let cityBuildings = [];
  let nextCityX = 0;
  while (nextCityX < canvas.width + 200) {
    const w = 24 + Math.floor(Math.random() * 26);
    const h = 25 + Math.floor(Math.random() * 55);
    cityBuildings.push({
      x: nextCityX,
      width: w,
      height: h,
      hasAntenna: Math.random() > 0.65,
      windows: Array.from({length: Math.floor(h / 12)}, (_, row) => ({
        row,
        lit: Math.random() > 0.4
      }))
    });
    nextCityX += w + Math.floor(Math.random() * 14) + 2;
  }

  // 天空像素白雲 (視差層 2：慢速飄動)
  let clouds = Array.from({length: 4}, (_, i) => ({
    x: 150 + i * 220 + Math.random() * 60,
    y: 45 + Math.random() * 55,
    scale: Math.random() > 0.5 ? 1 : 0.8
  }));

  // 地面起伏地形 (土丘與坑洞，與前景同速)
  let terrainBumps = Array.from({length: 5}, (_, i) => ({
    x: 100 + i * 190 + Math.random() * 50,
    type: Math.random() > 0.4 ? 'HILL' : 'PIT', // HILL: 凸起小土丘, PIT: 凹陷小坑洞
    width: 24 + Math.floor(Math.random() * 16)
  }));

  // 地面小碎石顆粒
  let groundDots = Array.from({length: 30}, () => ({
    x: Math.random() * canvas.width,
    y: groundOffset + 5 + Math.random() * 18,
    size: Math.random() > 0.5 ? 2 : 4
  }));

  // 夜間繁星
  const stars = Array.from({length: 20}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * 110,
    size: Math.random() > 0.5 ? 2 : 3
  }));

  // 繪製雙層視差城市背景
  function drawCityBackground() {
    const cityColor = isNight ? 'rgba(232, 234, 237, 0.12)' : 'rgba(83, 83, 83, 0.14)';
    const windowColor = isNight ? 'rgba(255, 224, 102, 0.35)' : 'rgba(247, 247, 247, 0.6)';

    cityBuildings.forEach(b => {
      const by = groundOffset - b.height;
      ctx.fillStyle = cityColor;
      ctx.fillRect(b.x, by, b.width, b.height);

      // 屋頂天線
      if (b.hasAntenna) {
        ctx.fillRect(b.x + Math.floor(b.width / 2) - 1, by - 10, 2, 10);
      }

      // 大樓小窗戶
      ctx.fillStyle = windowColor;
      b.windows.forEach(win => {
        if (win.lit) {
          const wy = by + 6 + win.row * 10;
          if (wy + 4 < groundOffset - 4) {
            ctx.fillRect(b.x + 5, wy, 4, 4);
            if (b.width > 30) {
              ctx.fillRect(b.x + b.width - 9, wy, 4, 4);
            }
          }
        }
      });
    });
  }

  // 繪製經典 Chrome 像素白雲
  function drawCloud(cloud) {
    ctx.fillStyle = isNight ? 'rgba(232, 234, 237, 0.25)' : '#dcdcdc';
    const cx = Math.floor(cloud.x);
    const cy = Math.floor(cloud.y);
    // 像素階梯雲朵
    ctx.fillRect(cx + 12, cy, 16, 4);
    ctx.fillRect(cx + 6, cy + 4, 28, 4);
    ctx.fillRect(cx, cy + 8, 42, 6);
    ctx.fillRect(cx + 4, cy + 14, 34, 3);
  }

  // 繪製起伏地形（地面線條 + 小土丘 + 凹坑）
  function drawTerrain(themeColor, bgColor) {
    ctx.fillStyle = themeColor;
    ctx.fillRect(0, groundOffset, canvas.width, 2);

    terrainBumps.forEach(bump => {
      const bx = Math.floor(bump.x);
      if (bump.type === 'HILL') {
        // 先用背景色遮掉原本的平線，再畫出凸起土丘
        ctx.fillStyle = bgColor;
        ctx.fillRect(bx + 2, groundOffset, bump.width - 4, 2);
        ctx.fillStyle = themeColor;
        ctx.fillRect(bx + 2, groundOffset - 2, 4, 2);
        ctx.fillRect(bx + 6, groundOffset - 4, bump.width - 12, 2);
        ctx.fillRect(bx + bump.width - 6, groundOffset - 2, 4, 2);
      } else {
        // 先用背景色挖空平線，再畫出凹陷坑洞
        ctx.fillStyle = bgColor;
        ctx.fillRect(bx + 2, groundOffset, bump.width - 4, 2);
        ctx.fillStyle = themeColor;
        ctx.fillRect(bx + 2, groundOffset + 2, 4, 2);
        ctx.fillRect(bx + 6, groundOffset + 4, bump.width - 12, 2);
        ctx.fillRect(bx + bump.width - 6, groundOffset + 2, 4, 2);
      }
    });

    // 地面顆粒
    ctx.fillStyle = themeColor;
    groundDots.forEach(dot => {
      ctx.fillRect(dot.x, dot.y, dot.size, 1);
    });
  }

  // 音效
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(freq, type, duration) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function playJumpSound() { playSound(400, 'square', 0.1); }
  function playHitSound() { playSound(150, 'sawtooth', 0.25); }
  function playScoreSound() { playSound(850, 'sine', 0.15); }

  // ==========================================
  // 2. 精緻恐龍物件（含經典驚訝死法表情）
  // ==========================================
  const dino = {
    x: 50,
    y: 164,
    width: 44,
    height: 46,
    velocityY: 0,
    gravity: 0.65,
    jumpPower: -11.5,
    isGrounded: true,
    isDucking: false,
    legFrame: 0,
    
    draw() {
      const color = isNight ? '#e8eaed' : '#535353';
      const bgColor = isNight ? '#202124' : '#f7f7f7';
      const isDead = gameState === 'GAMEOVER';
      ctx.fillStyle = color;

      // 存活且在地面蹲下時繪製蹲姿；死亡時彈起呈現經典驚訝表情
      if (this.isDucking && this.isGrounded && !isDead) {
        const dy = 184;
        ctx.fillRect(this.x, dy + 10, 52, 16);
        ctx.fillRect(this.x + 36, dy + 4, 20, 12);
        ctx.fillStyle = bgColor;
        ctx.fillRect(this.x + 50, dy + 6, 2, 2);
        ctx.fillStyle = color;
        if (this.legFrame < 5) {
          ctx.fillRect(this.x + 10, dy + 26, 4, 4);
        } else {
          ctx.fillRect(this.x + 32, dy + 26, 4, 4);
        }
      } else {
        const dx = this.x;
        const dy = this.y;

        // 頭部與嘴巴
        ctx.fillRect(dx + 22, dy, 22, 18);
        if (isDead) {
          // 死亡時嘴巴微張驚訝
          ctx.fillRect(dx + 26, dy + 14, 16, 3);
        } else {
          ctx.fillRect(dx + 26, dy + 12, 18, 4);
        }

        // 眼睛繪製
        if (isDead) {
          // 經典驚訝死法：睜大白眼眶 + 黑色小瞳孔
          ctx.fillStyle = bgColor;
          ctx.fillRect(dx + 25, dy + 3, 6, 6);
          ctx.fillStyle = color;
          ctx.fillRect(dx + 27, dy + 5, 2, 2);
        } else {
          // 正常眼睛
          ctx.fillStyle = bgColor;
          ctx.fillRect(dx + 26, dy + 4, 3, 3);
          ctx.fillStyle = color;
        }

        // 軀幹與尾巴
        ctx.fillRect(dx + 10, dy + 14, 20, 20);
        ctx.fillRect(dx + 4, dy + 18, 6, 12);
        ctx.fillRect(dx, dy + 22, 4, 6);
        // 小手
        ctx.fillRect(dx + 28, dy + 22, 4, 4);

        // 腳部
        if (!this.isGrounded || isDead) {
          ctx.fillRect(dx + 12, dy + 34, 4, 10);
          ctx.fillRect(dx + 22, dy + 34, 4, 10);
        } else {
          if (this.legFrame < 5) {
            ctx.fillRect(dx + 12, dy + 34, 4, 12);
            ctx.fillRect(dx + 14, dy + 44, 4, 2);
            ctx.fillRect(dx + 22, dy + 34, 4, 6);
          } else {
            ctx.fillRect(dx + 12, dy + 34, 4, 6);
            ctx.fillRect(dx + 22, dy + 34, 4, 12);
            ctx.fillRect(dx + 24, dy + 44, 4, 2);
          }
        }
      }
    },
    jump() {
      if (this.isGrounded) {
        this.velocityY = this.jumpPower;
        this.isGrounded = false;
        playJumpSound();
      }
    },
    update() {
      if (!this.isGrounded) {
        this.velocityY += this.gravity;
        this.y += this.velocityY;
        if (this.y >= 164) {
          this.y = 164;
          this.velocityY = 0;
          this.isGrounded = true;
        }
      }
      this.legFrame = (this.legFrame + 1) % 10;
    }
  };

  // 障礙物物件與動態繪製
  let obstacles = [];
  function spawnObstacle() {
    const isBird = Math.random() < 0.35 && score > 200;
    if (!isBird) {
      const count = Math.floor(Math.random() * 3) + 1;
      obstacles.push({
        x: canvas.width,
        y: 166,
        width: count * 16 + 6,
        height: 44,
        type: 'CACTUS',
        count: count
      });
    } else {
      const birdY = Math.random() < 0.5 ? 125 : 160;
      obstacles.push({
        x: canvas.width,
        y: birdY,
        width: 38,
        height: 26,
        type: 'BIRD',
        wingFrame: 0
      });
    }
  }

  function drawCactus(obs) {
    ctx.fillStyle = isNight ? '#e8eaed' : '#535353';
    for (let c = 0; c < obs.count; c++) {
      const cx = obs.x + c * 16;
      const cy = obs.y;
      ctx.fillRect(cx + 4, cy, 8, 44);
      ctx.fillRect(cx, cy + 12, 4, 14);
      ctx.fillRect(cx, cy + 22, 8, 4);
      ctx.fillRect(cx + 12, cy + 18, 4, 14);
      ctx.fillRect(cx + 8, cy + 28, 8, 4);
    }
  }

  function drawBird(obs) {
    ctx.fillStyle = isNight ? '#e8eaed' : '#535353';
    const bx = obs.x;
    const by = obs.y;
    ctx.fillRect(bx + 10, by + 10, 20, 10);
    ctx.fillRect(bx, by + 6, 10, 6);
    ctx.fillRect(bx + 30, by + 12, 8, 4);

    obs.wingFrame = (obs.wingFrame + 1) % 12;
    if (obs.wingFrame < 6) {
      ctx.fillRect(bx + 14, by, 6, 10);
      ctx.fillRect(bx + 16, by - 4, 4, 4);
    } else {
      ctx.fillRect(bx + 14, by + 18, 6, 10);
      ctx.fillRect(bx + 16, by + 26, 4, 4);
    }
  }

  // 繪製經典像素重來圖示 (↻)
  function drawRestartIcon(x, y, themeColor, bgColor) {
    ctx.fillStyle = themeColor;
    // 外框圓角方塊
    ctx.fillRect(x, y + 2, 34, 26);
    ctx.fillRect(x + 2, y, 30, 30);
    // 內部挖空
    ctx.fillStyle = bgColor;
    ctx.fillRect(x + 3, y + 3, 28, 24);
    // 中心旋轉箭頭
    ctx.fillStyle = themeColor;
    ctx.fillRect(x + 12, y + 8, 10, 3);
    ctx.fillRect(x + 10, y + 11, 3, 8);
    ctx.fillRect(x + 12, y + 19, 10, 3);
    ctx.fillRect(x + 21, y + 15, 3, 4);
    // 箭頭尖端
    ctx.fillRect(x + 20, y + 6, 3, 7);
    ctx.fillRect(x + 23, y + 8, 2, 3);
  }

  // Firebase 排行榜數據
  onValue(leaderboardRef, (snapshot) => {
    const data = snapshot.val();
    globalScores = [];
    if (data) {
      Object.keys(data).forEach(key => {
        globalScores.push(data[key]);
      });
      globalScores.sort((a, b) => b.score - a.score);
    }
    updateLeaderboardUI();
    if (globalScores.length > 0) {
      highScore = globalScores[0].score;
    }
  });

  function updateLeaderboardUI() {
    leaderboardList.innerHTML = '';
    const top10 = globalScores.slice(0, 10);
    if (top10.length === 0) {
      leaderboardList.innerHTML = '<li>尚未有紀錄</li>';
      return;
    }
    top10.forEach((item, index) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${index + 1}. ${item.name}</span><span>${String(item.score).padStart(5, '0')}</span>`;
      leaderboardList.appendChild(li);
    });
  }

  function handlePrimaryAction() {
    if (isModalOpen()) return;

    if (gameState === 'PLAYING') {
      dino.jump();
    } else if (gameState === 'START' || gameState === 'GAMEOVER') {
      resetGame();
    }
  }

  window.addEventListener('keydown', (e) => {
    if (isModalOpen()) return;

    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      handlePrimaryAction();
    }
    if (e.code === 'ArrowDown' && gameState === 'PLAYING') {
      dino.isDucking = true;
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowDown') {
      dino.isDucking = false;
    }
  });

  canvas.addEventListener('touchstart', (e) => {
    if (isModalOpen()) return;
    e.preventDefault();
    handlePrimaryAction();
  }, { passive: false });

  canvas.addEventListener('mousedown', (e) => {
    if (isModalOpen()) return;
    if (e.button === 0) {
      handlePrimaryAction();
    }
  });

  function resetGame() {
    score = 0;
    currentSpeed = initialSpeed;
    obstacles = [];
    dino.y = 164;
    dino.velocityY = 0;
    dino.isGrounded = true;
    dino.isDucking = false;
    gameState = 'PLAYING';
    isNight = false;
    document.body.classList.remove('night');
  }

  // 縮小後的精準碰撞判定箱
  function checkCollision(dinoObj, obs) {
    const dinoHitbox = dinoObj.isDucking && dinoObj.isGrounded
      ? { x: dinoObj.x + 8, y: 196, width: 38, height: 12 }
      : { x: dinoObj.x + 12, y: dinoObj.y + 8, width: 22, height: 32 };

    const obsHitbox = obs.type === 'CACTUS'
      ? { x: obs.x + 5, y: obs.y + 6, width: Math.max(6, obs.width - 10), height: obs.height - 8 }
      : { x: obs.x + 6, y: obs.y + 8, width: obs.width - 12, height: obs.height - 12 };

    return (
      dinoHitbox.x < obsHitbox.x + obsHitbox.width &&
      dinoHitbox.x + dinoHitbox.width > obsHitbox.x &&
      dinoHitbox.y < obsHitbox.y + obsHitbox.height &&
      dinoHitbox.y + dinoHitbox.height > obsHitbox.y
    );
  }

  function handleGameOver() {
    gameState = 'GAMEOVER';
    playHitSound();

    const currentScoreInt = Math.floor(score);
    const savedName = localStorage.getItem('pixel_runner_username') || '';
    nameInput.value = savedName;

    const isTopScore = globalScores.length < 10 || currentScoreInt > (globalScores[9]?.score || 0);

    if (isTopScore && currentScoreInt > 0) {
      nameModal.style.display = 'block';
      setTimeout(() => nameInput.focus(), 50);
    }
  }

  function submitLeaderboardName() {
    const name = nameInput.value.trim() || '無名氏';
    localStorage.setItem('pixel_runner_username', name);
    const currentScoreInt = Math.floor(score);
    
    const newScoreRef = ref(db, 'leaderboard/' + Date.now());
    set(newScoreRef, {
      name: name,
      score: currentScoreInt
    });

    nameModal.style.display = 'none';
    nameInput.blur();
  }

  submitBtn.addEventListener('click', submitLeaderboardName);
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitLeaderboardName();
    }
  });

  // 主更新邏輯
  function update() {
    frameCount++;

    if (gameState === 'PLAYING') {
      const currentScoreInt = Math.floor(score);
      currentSpeed = Math.min(initialSpeed + currentScoreInt * 0.008, maxSpeed);

      score += 0.15;
      const updatedScoreInt = Math.floor(score);

      if (updatedScoreInt > 0 && updatedScoreInt % 100 === 0 && Math.floor(score - 0.15) % 100 !== 0) {
        playScoreSound();
      }

      if (updatedScoreInt > 0 && updatedScoreInt % 500 === 0) {
        isNight = Math.floor(updatedScoreInt / 500) % 2 === 1;
        if (isNight) document.body.classList.add('night');
        else document.body.classList.remove('night');
      }

      dino.update();

      // 視差層 1：遠景城市慢速移動 (0.15 倍速)
      cityBuildings.forEach(b => {
        b.x -= currentSpeed * 0.15;
      });
      if (cityBuildings.length > 0 && cityBuildings[0].x + cityBuildings[0].width < 0) {
        const lastB = cityBuildings[cityBuildings.length - 1];
        const w = 24 + Math.floor(Math.random() * 26);
        const h = 25 + Math.floor(Math.random() * 55);
        cityBuildings.shift();
        cityBuildings.push({
          x: lastB.x + lastB.width + Math.floor(Math.random() * 14) + 2,
          width: w,
          height: h,
          hasAntenna: Math.random() > 0.65,
          windows: Array.from({length: Math.floor(h / 12)}, (_, row) => ({
            row,
            lit: Math.random() > 0.4
          }))
        });
      }

      // 視差層 2：天空雲朵緩慢移動 (0.25 倍速)
      clouds.forEach(cloud => {
        cloud.x -= currentSpeed * 0.25;
        if (cloud.x + 50 < 0) {
          cloud.x = canvas.width + Math.random() * 120;
          cloud.y = 40 + Math.random() * 60;
        }
      });

      // 前景層：起伏地形與地面顆粒 (1.0 倍速)
      terrainBumps.forEach(bump => {
        bump.x -= currentSpeed;
        if (bump.x + bump.width < 0) {
          bump.x = canvas.width + Math.random() * 100;
          bump.type = Math.random() > 0.4 ? 'HILL' : 'PIT';
          bump.width = 24 + Math.floor(Math.random() * 16);
        }
      });

      groundDots.forEach(dot => {
        dot.x -= currentSpeed;
        if (dot.x < 0) dot.x = canvas.width;
      });

      // 障礙物生成與更新
      if (frameCount % Math.max(35, Math.floor(110 - currentSpeed * 3)) === 0) {
        if (Math.random() < 0.65) spawnObstacle();
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= currentSpeed;

        if (checkCollision(dino, obstacles[i])) {
          handleGameOver();
        }

        if (obstacles[i].x + obstacles[i].width < 0) {
          obstacles.splice(i, 1);
        }
      }
    }
  }

  // 主畫面繪製
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const themeColor = isNight ? '#e8eaed' : '#535353';
    const bgColor = isNight ? '#202124' : '#f7f7f7';

    // 1. 夜間月亮與繁星
    if (isNight) {
      ctx.fillStyle = '#e8eaed';
      stars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));
      ctx.fillRect(680, 40, 20, 20);
      ctx.fillStyle = bgColor;
      ctx.fillRect(676, 36, 12, 12);
    }

    // 2. 雙層視差背景（城市剪影 + 白雲）
    drawCityBackground();
    clouds.forEach(cloud => drawCloud(cloud));

    // 3. 起伏地形與顆粒
    drawTerrain(themeColor, bgColor);

    // 4. 主角與障礙物
    dino.draw();
    obstacles.forEach(obs => {
      if (obs.type === 'CACTUS') drawCactus(obs);
      else drawBird(obs);
    });

    // 5. 計分板
    ctx.fillStyle = themeColor;
    ctx.font = '700 18px "Courier New", monospace';
    const displayScore = String(Math.floor(score)).padStart(5, '0');
    const displayHigh = String(Math.floor(highScore)).padStart(5, '0');
    ctx.fillText(`HI ${displayHigh}  ${displayScore}`, canvas.width - 190, 35);

    // 6. 狀態文字與重來圖示
    if (gameState === 'START') {
      ctx.fillText('按下 [Space] 或點擊螢幕開始遊戲', canvas.width / 2 - 175, 110);
    } else if (gameState === 'GAMEOVER') {
      ctx.fillText('G A M E   O V E R', canvas.width / 2 - 100, 95);
      drawRestartIcon(canvas.width / 2 - 17, 112, themeColor, bgColor);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
