<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沙沙dino jump game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f7f7f7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      color: #535353;
      transition: background-color 0.5s, color 0.5s;
    }
    body.night {
      background-color: #202124;
      color: #e8eaed;
    }
    body.meteor-mode {
      background-color: #2b1818;
      color: #ffdad6;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 820px;
      padding: 20px;
    }
    #auth-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      padding: 8px 14px;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
    }
    body.night #auth-bar, body.meteor-mode #auth-bar {
      background: rgba(255, 255, 255, 0.08);
    }
    #user-profile, #bar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    #user-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: none;
      border: 1.5px solid currentColor;
    }
    .auth-btn {
      padding: 5px 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border: 2px solid currentColor;
      border-radius: 6px;
      background: transparent;
      color: inherit;
      transition: all 0.2s;
    }
    .auth-btn:hover:not(:disabled) {
      background: #535353;
      color: #fff;
    }
    body.night .auth-btn:hover:not(:disabled),
    body.meteor-mode .auth-btn:hover:not(:disabled) {
      background: #e8eaed;
      color: #202124;
    }
    /* 外掛密技輸入框區塊 */
    #cheat-code-box {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #cheat-code-input {
      width: 96px;
      padding: 4px 8px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      border: 2px solid currentColor;
      border-radius: 6px;
      background: transparent;
      color: inherit;
      outline: none;
      user-select: text;
      text-align: center;
    }
    #cheat-code-input::placeholder {
      color: inherit;
      opacity: 0.55;
    }
    #cheat-fly-btn {
      display: none; /* 輸入 fly 解鎖前隱藏 */
      border-color: #ff6d00;
      color: #e65100;
    }
    body.night #cheat-fly-btn, body.meteor-mode #cheat-fly-btn {
      border-color: #ffab40;
      color: #ffab40;
    }
    #cheat-fly-btn:hover:not(:disabled) {
      background: #ff6d00 !important;
      color: #fff !important;
    }
    #cheat-fly-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    canvas {
      background-color: transparent;
      display: block;
      margin: 0 auto;
      max-width: 100%;
      cursor: pointer;
    }
    #ui-panel {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-top: 15px;
      font-weight: bold;
      flex-wrap: wrap;
    }
    .panel-box {
      background: rgba(0, 0, 0, 0.05);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
    }
    body.night .panel-box, body.meteor-mode .panel-box {
      background: rgba(255, 255, 255, 0.08);
    }
    .panel-box h4 {
      margin-bottom: 8px;
      border-bottom: 2px dashed currentColor;
      padding-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #controls-info {
      flex: 1.4;
      min-width: 280px;
      line-height: 1.6;
    }
    #skin-selector {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 6px;
    }
    .skin-btn {
      padding: 6px 8px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: bold;
      border: 2px solid currentColor;
      border-radius: 5px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      opacity: 0.55;
      transition: all 0.2s;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .skin-btn.unlocked {
      opacity: 1;
    }
    .skin-btn.active {
      background: #535353;
      color: #fff;
    }
    body.night .skin-btn.active, body.meteor-mode .skin-btn.active {
      background: #e8eaed;
      color: #202124;
    }
    #leaderboard-box {
      flex: 0.8;
      min-width: 220px;
    }
    #leaderboard-list {
      list-style: none;
    }
    #leaderboard-list li {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
    }
    #achievement-toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #2b2c2f;
      color: #ffd700;
      border: 2px solid #ffd700;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.45);
      transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 50;
      pointer-events: none;
    }
    #achievement-toast.show {
      transform: translateX(-50%) translateY(0);
    }
    .modal-box {
      display: none;
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      color: #333;
      padding: 25px;
      border: 3px solid #535353;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      text-align: center;
      z-index: 20;
      min-width: 280px;
    }
    body.night .modal-box, body.meteor-mode .modal-box {
      background: #2b2c2f;
      color: #fff;
      border-color: #e8eaed;
    }
    .modal-box input {
      padding: 10px;
      margin: 12px 0;
      font-size: 16px;
      font-family: inherit;
      width: 85%;
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
      user-select: text;
    }
    .modal-btn-group {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .modal-box button {
      padding: 9px 18px;
      font-size: 14px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      background: #535353;
      color: #fff;
      border: none;
      border-radius: 6px;
    }
    .modal-box button.cancel-btn {
      background: transparent;
      color: inherit;
      border: 2px solid currentColor;
    }
    body.night .modal-box button:not(.cancel-btn),
    body.meteor-mode .modal-box button:not(.cancel-btn) {
      background: #e8eaed;
      color: #202124;
    }
  </style>
</head>
<body>

<div id="achievement-toast">🏆 成就解鎖！</div>

<div id="game-container">
  <div id="auth-bar">
    <div id="user-profile">
      <img id="user-avatar" src="" alt="頭像">
      <span id="user-status-text">☁️ 訪客模式</span>
      <span>｜暱稱：<b id="current-player-name">無名氏</b></span>
      <button id="edit-name-btn" class="auth-btn">✏️ 改名</button>
    </div>
    <div id="bar-actions">
      <!-- 外掛密技輸入框 -->
      <div id="cheat-code-box">
        <input type="text" id="cheat-code-input" maxlength="12" placeholder="輸入外掛碼" autocomplete="off">
        <button id="cheat-unlock-btn" class="auth-btn">🔓 解鎖</button>
      </div>
      <!-- 輸入 fly 解鎖後才會顯示的起飛按鈕 -->
      <button id="cheat-fly-btn" class="auth-btn" title="按下開啟超音速噴射暴衝 10 秒，但本局成績將無法登上排行榜">🚀 噴射暴衝 10s [F]</button>
      <button id="google-login-btn" class="auth-btn">🔑 Google 登入同步</button>
      <button id="google-logout-btn" class="auth-btn" style="display: none;">登出</button>
    </div>
  </div>

  <canvas id="gameCanvas" width="800" height="250"></canvas>
  
  <div id="ui-panel">
    <div id="controls-info" class="panel-box">
      <h4>🎮 操作與特色玩法</h4>
      <p>• [Space] / [↑] / 點擊：跳躍 / 重來 ｜ [↓] 按住：蹲下閃避</p>
      <p>• <b>極限擦身</b>：貼近障礙起跳觸發 COMBO ｜ <b>流星許願</b>：流星雨跳躍 +50 分</p>
      <p>• <b>🚀 外掛密技</b>：上方輸入密碼 解鎖起飛外掛，按 <b>[F]</b> 暴衝 10 秒（<b>使用後當局不上榜</b>）</p>
      
      <h4 style="margin-top: 10px;">
        <span>🦖 恐龍造型衣櫃（達成條件解鎖）</span>
        <span id="skin-progress-text" style="font-size: 12px;">1 / 10</span>
      </h4>
      <div id="skin-selector">
        <button class="skin-btn unlocked active" data-skin="DEFAULT">🦖 經典恐龍</button>
        <button class="skin-btn" data-skin="DUCK_PRO" title="累計蹲下閃避翼龍 5 次解鎖">🔒 潛行忍者龍</button>
        <button class="skin-btn" data-skin="COOL" title="累計極限擦身 10 次解鎖">🔒 墨鏡酷龍</button>
        <button class="skin-btn" data-skin="WIZARD" title="在流星雨之夜許願跳躍 3 次解鎖">🔒 星辰法師龍</button>
        <button class="skin-btn" data-skin="RAIN_FROG" title="在雷雨天氣中累計跳躍 30 次解鎖">🔒 雨衣青蛙龍</button>
        <button class="skin-btn" data-skin="GENTLEMAN" title="單場突破 500 分解鎖">🔒 紳士恐龍</button>
        <button class="skin-btn" data-skin="COMBO_KING" title="單場達成 3 連擊擦身 (COMBO x3) 解鎖">🔒 烈焰疾風龍</button>
        <button class="skin-btn" data-skin="ASTRONAUT" title="單場突破 1000 分（挺過火山隕石）解鎖">🔒 太空人恐龍</button>
        <button class="skin-btn" data-skin="CYBER" title="累積總分達 3000 分解鎖">🔒 機械暴龍</button>
        <button class="skin-btn" data-skin="GOLDEN" title="累積遊玩達 15 場或總分 8000 分解鎖">🔒 黃金傳說龍</button>
      </div>
    </div>

    <div id="leaderboard-box" class="panel-box">
      <h4>🏆 全域前 10 名排行榜</h4>
      <ol id="leaderboard-list">
        <li>載入中...</li>
      </ol>
    </div>
  </div>

  <div id="name-modal" class="modal-box">
    <h3>🎉 榮登高分榜！</h3>
    <p>請確認或修改上榜名字：</p>
    <input type="text" id="player-name-input" maxlength="10" placeholder="您的名字">
    <div class="modal-btn-group">
      <button id="submit-name-btn">確認送出</button>
    </div>
  </div>

  <div id="rename-modal" class="modal-box">
    <h3>✏️ 更改玩家名稱</h3>
    <p>輸入新的暱稱（最多 10 個字）：</p>
    <input type="text" id="rename-input" maxlength="10" placeholder="輸入新名稱">
    <div class="modal-btn-group">
      <button id="save-rename-btn">儲存名稱</button>
      <button id="cancel-rename-btn" class="cancel-btn">取消</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBZ9s5Ku8aEzaVEmk_7ztbIiHXI6qmz5H0",
    authDomain: "my-project-zack0512.firebaseapp.com",
    databaseURL: "https://my-project-zack0512-default-rtdb.firebaseio.com",
    projectId: "my-project-zack0512",
    storageBucket: "my-project-zack0512.firebasestorage.app",
    messagingSenderId: "972310414233",
    appId: "1:972310414233:web:4014908a1e187754530908",
    measurementId: "G-YKEN22N04Y"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  const googleProvider = new GoogleAuthProvider();
  googleProvider.setCustomParameters({ prompt: 'select_account' });

  const leaderboardRef = ref(db, 'leaderboard');

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const nameModal = document.getElementById('name-modal');
  const nameInput = document.getElementById('player-name-input');
  const submitBtn = document.getElementById('submit-name-btn');
  const leaderboardList = document.getElementById('leaderboard-list');
  const toastEl = document.getElementById('achievement-toast');
  const progressTextEl = document.getElementById('skin-progress-text');

  const loginBtn = document.getElementById('google-login-btn');
  const logoutBtn = document.getElementById('google-logout-btn');
  const userAvatar = document.getElementById('user-avatar');
  const userStatusText = document.getElementById('user-status-text');
  const currentPlayerNameEl = document.getElementById('current-player-name');
  const editNameBtn = document.getElementById('edit-name-btn');
  const renameModal = document.getElementById('rename-modal');
  const renameInput = document.getElementById('rename-input');
  const saveRenameBtn = document.getElementById('save-rename-btn');
  const cancelRenameBtn = document.getElementById('cancel-rename-btn');

  // 外掛密技輸入框與按鈕
  const cheatCodeBox = document.getElementById('cheat-code-box');
  const cheatCodeInput = document.getElementById('cheat-code-input');
  const cheatUnlockBtn = document.getElementById('cheat-unlock-btn');
  const cheatFlyBtn = document.getElementById('cheat-fly-btn');

  let currentUser = null;
  let gameState = 'START';
  let score = 0;
  let highScore = 0;
  let globalScores = [];
  let currentSpeed = 6;
  const initialSpeed = 6;
  const maxSpeed = 22;
  let frameCount = 0;

  // ==========================================
  // 外掛「密技解鎖 + 超音速噴射暴衝」系統
  // ==========================================
  let isFlyCheatUnlocked = false; // 是否已輸入 fly 解鎖外掛
  let isFlyingCheat = false;
  let flyEndTime = 0;
  let landingGraceEndTime = 0;
  let usedCheatThisRun = false;
  let boostMultiplier = 1.0;

  let screenShake = 0;
  let sonicFlashAlpha = 0;
  let jetParticles = [];
  let sonicRings = [];
  let speedLines = [];
  let afterimages = [];

  function tryUnlockFlyCheat() {
    const code = cheatCodeInput.value.trim().toLowerCase();
    if (code === 'fly') {
      isFlyCheatUnlocked = true;
      cheatCodeBox.style.display = 'none';
      cheatFlyBtn.style.display = 'inline-block';
      cheatCodeInput.blur();
      updateCheatButtonUI();
      showToast('🔓 起飛外掛已解鎖！遊戲中按 [F] 或按鈕起飛（使用後本局不上榜）');
    } else {
      showToast('❌ 外掛碼錯誤！不告訴你提示，自己想，哈哈！');
      cheatCodeInput.value = '';
      cheatCodeInput.focus();
    }
  }

  cheatUnlockBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    tryUnlockFlyCheat();
    cheatUnlockBtn.blur();
  });

  cheatCodeInput.addEventListener('keydown', (e) => {
    e.stopPropagation(); // 防止輸入文字時觸發遊戲按鍵
    if (e.key === 'Enter') {
      e.preventDefault();
      tryUnlockFlyCheat();
    } else if (e.key === 'Escape') {
      cheatCodeInput.blur();
    }
  });

  cheatCodeInput.addEventListener('click', (e) => {
    e.stopPropagation();
  });

  function spawnJetBurst(x, y) {
    screenShake = 14;
    sonicFlashAlpha = 0.55;
    sonicRings.push({ x: x + 20, y: y + 22, radius: 6, alpha: 1.0 });
    for (let i = 0; i < 36; i++) {
      const angle = (Math.PI * 0.65) + (Math.random() - 0.5) * 1.1;
      const spd = 5 + Math.random() * 11;
      jetParticles.push({
        x: x + 4,
        y: y + 18 + (Math.random() - 0.5) * 14,
        vx: Math.cos(angle) * spd - 4,
        vy: Math.sin(angle) * spd,
        size: 3 + Math.random() * 5,
        life: 1.0,
        decay: 0.03 + Math.random() * 0.03,
        color: ['#ffffff', '#ffd54f', '#ff6d00', '#00e5ff'][Math.floor(Math.random() * 4)]
      });
    }
  }

  function updateCheatButtonUI() {
    if (!isFlyCheatUnlocked) {
      cheatFlyBtn.style.display = 'none';
      return;
    }
    cheatFlyBtn.style.display = 'inline-block';

    if (isFlyingCheat) {
      const remain = Math.max(0, (flyEndTime - Date.now()) / 1000).toFixed(1);
      cheatFlyBtn.textContent = `🔥 暴衝噴射中 (${remain}s)`;
      cheatFlyBtn.disabled = true;
    } else if (gameState !== 'PLAYING') {
      cheatFlyBtn.textContent = '🚀 噴射暴衝 10s [F]';
      cheatFlyBtn.disabled = true;
    } else {
      cheatFlyBtn.textContent = usedCheatThisRun ? '🚀 再次暴衝 10s [F]' : '🚀 噴射暴衝 10s [F]';
      cheatFlyBtn.disabled = false;
    }
  }

  function activateCheatFly() {
    if (!isFlyCheatUnlocked) return;
    if (gameState !== 'PLAYING' || isModalOpen()) return;
    if (isFlyingCheat) return;

    isFlyingCheat = true;
    usedCheatThisRun = true;
    flyEndTime = Date.now() + 10000;
    boostMultiplier = 2.8;
    dino.isGrounded = false;
    dino.isDucking = false;
    dino.velocityY = 0;

    spawnJetBurst(dino.x, dino.y);
    playCheatFlySound();
    spawnFloatingText('🔥 SUPER SONIC BOOST!! 2.8x 暴衝!', dino.x, 78, '#ff6d00');
    showToast('🚀 超音速噴射啟動！本局成績將不計入排行榜');
    updateCheatButtonUI();
  }

  cheatFlyBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    activateCheatFly();
    cheatFlyBtn.blur();
  });

  // ==========================================
  // 1. 玩家名稱管理 & 10 款造型存檔系統
  // ==========================================
  const defaultStats = {
    customName: localStorage.getItem('pixel_runner_username') || '',
    totalScore: 0,
    totalNearMiss: 0,
    maxSingleScore: 0,
    maxCombo: 0,
    totalWishes: 0,
    totalRainJumps: 0,
    totalBirdDucks: 0,
    gamesPlayed: 0,
    unlockedSkins: ['DEFAULT'],
    selectedSkin: 'DEFAULT'
  };

  let savedRaw = JSON.parse(localStorage.getItem('dino_stats_v1')) || {};
  let stats = { ...defaultStats, ...savedRaw };

  function getActivePlayerName() {
    if (stats.customName && stats.customName.trim() !== '') {
      return stats.customName.trim().slice(0, 10);
    }
    if (currentUser && currentUser.displayName) {
      return currentUser.displayName.trim().slice(0, 10);
    }
    return '無名氏';
  }

  function updatePlayerNameDisplay() {
    currentPlayerNameEl.textContent = getActivePlayerName();
  }

  function setPlayerName(newName) {
    const cleanName = newName.trim().slice(0, 10) || '無名氏';
    stats.customName = cleanName;
    localStorage.setItem('pixel_runner_username', cleanName);
    updatePlayerNameDisplay();
    saveStats();
  }

  updatePlayerNameDisplay();

  editNameBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const current = getActivePlayerName();
    renameInput.value = current === '無名氏' ? '' : current;
    renameModal.style.display = 'block';
    setTimeout(() => renameInput.focus(), 50);
  });

  function confirmRename() {
    const val = renameInput.value.trim();
    if (!val) {
      showToast('⚠️ 名稱不能為空白喔！');
      renameInput.focus();
      return;
    }
    setPlayerName(val);
    renameModal.style.display = 'none';
    renameInput.blur();
    showToast(`✅ 名稱已更改為「${getActivePlayerName()}」`);
  }

  saveRenameBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    confirmRename();
  });

  cancelRenameBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    renameModal.style.display = 'none';
    renameInput.blur();
  });

  renameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      confirmRename();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      renameModal.style.display = 'none';
      renameInput.blur();
    }
  });

  const SKIN_CONFIG = {
    DEFAULT: {
      name: '🦖 經典恐龍',
      condText: () => '預設可用',
      check: () => true
    },
    DUCK_PRO: {
      name: '🥷 潛行忍者龍',
      condText: () => `蹲閃翼龍 (${Math.min(5, stats.totalBirdDucks)}/5)`,
      check: () => stats.totalBirdDucks >= 5
    },
    COOL: {

    try {
      const userStatsRef = ref(db, `users/${user.uid}/stats`);
      const snapshot = await get(userStatsRef);

      if (snapshot.exists()) {
        const cloudData = snapshot.val();
        const mergedSkins = Array.from(new Set([
          ...(stats.unlockedSkins || ['DEFAULT']),
          ...(cloudData.unlockedSkins || ['DEFAULT'])
        ]));

        const resolvedName = stats.customName || cloudData.customName || (user.displayName ? user.displayName.slice(0, 10) : '');

        stats = {
          customName: resolvedName,
          totalScore: Math.max(stats.totalScore, cloudData.totalScore || 0),
          totalNearMiss: Math.max(stats.totalNearMiss, cloudData.totalNearMiss || 0),
          maxSingleScore: Math.max(stats.maxSingleScore, cloudData.maxSingleScore || 0),
          maxCombo: Math.max(stats.maxCombo, cloudData.maxCombo || 0),
          totalWishes: Math.max(stats.totalWishes, cloudData.totalWishes || 0),
          totalRainJumps: Math.max(stats.totalRainJumps, cloudData.totalRainJumps || 0),
          totalBirdDucks: Math.max(stats.totalBirdDucks, cloudData.totalBirdDucks || 0),
          gamesPlayed: Math.max(stats.gamesPlayed, cloudData.gamesPlayed || 0),
          unlockedSkins: mergedSkins,
          selectedSkin: cloudData.selectedSkin && mergedSkins.includes(cloudData.selectedSkin)
            ? cloudData.selectedSkin
            : stats.selectedSkin
        };
      } else if (!stats.customName && user.displayName) {
        stats.customName = user.displayName.slice(0, 10);

      if (stats.customName) {

      checkAchievements(stats.maxSingleScore);

      showToast(`☁️ 已同步 ${getActivePlayerName()} 的雲端存檔！`);

    const phase = Math.floor(currentScoreInt / 400) % 4;

    if (phase === 0) {
      targetWeather = 'CLEAR';
      targetNight = false;
    } else if (phase === 1) {
      targetWeather = 'RAIN';
      targetNight = false;
    } else if (phase === 2) {
      targetWeather = 'METEOR_SHOWER';
      targetNight = true;
    } else if (phase === 3) {
      targetWeather = currentScoreInt >= 800 ? 'VOLCANO' : 'METEOR_SHOWER';
      targetNight = true;
    }

    if (weather !== targetWeather || isNight !== targetNight) {
      weather = targetWeather;
      isNight = targetNight;
      document.body.classList.remove('night', 'meteor-mode');
      if (weather === 'VOLCANO') {

        spawnFloatingText('🌋 警告：火山隕石雨來襲！', canvas.width / 2 - 120, 75, '#ff5252');

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(freq, type, duration, gainVal = 0.08) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function playJumpSound() { playSound(400, 'square', 0.1); }

    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    osc1.type = 'sawtooth';
    osc1.frequency.setValueAtTime(110, audioCtx.currentTime);
    osc1.frequency.exponentialRampToValueAtTime(680, audioCtx.currentTime + 0.45);
    gain1.gain.setValueAtTime(0.14, audioCtx.currentTime);
    gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc1.connect(gain1);
    gain1.connect(audioCtx.destination);
    osc1.start();
    osc1.stop(audioCtx.currentTime + 0.5);

    setTimeout(() => playSound(880, 'square', 0.18, 0.07), 120);
  }

      ctx.save();

      if (isFlyingCheat) {
        const remainMs = flyEndTime - Date.now();
        if (remainMs < 1500 && Math.floor(frameCount / 4) % 2 === 0) {
          ctx.globalAlpha = 0.45;
        }
        const tilt = 0.14;
        const vibY = (Math.random() - 0.5) * 2.2;
        ctx.translate(this.x + 22, this.y + 23 + vibY);
        ctx.rotate(tilt);
        ctx.translate(-(this.x + 22), -(this.y + 23));
      }

      const skin = stats.selectedSkin;
      let color = isNight ? '#e8eaed' : '#535353';

      if (skin === 'CYBER') {
        color = isNight ? '#00e5ff' : '#0277bd';
      } else if (skin === 'GOLDEN') {
        color = isNight ? '#ffd54f' : '#d49b00';
      } else if (skin === 'RAIN_FROG') {
        color = isNight ? '#69f0ae' : '#2e7d32';
      } else if (skin === 'DUCK_PRO') {
        color = isNight ? '#b0bec5' : '#263238';
      } else if (skin === 'WIZARD') {
        color = isNight ? '#b388ff' : '#4a148c';
      } else if (skin === 'COMBO_KING') {
        color = isNight ? '#ff6e40' : '#d84315';
      } else if (skin === 'ASTRONAUT') {
        color = isNight ? '#ffffff' : '#607d8b';
      }

      const bgColor = weather === 'VOLCANO' ? '#2b1818' : (isNight ? '#202124' : '#f7f7f7');
      const isDead = gameState === 'GAMEOVER';
      ctx.fillStyle = color;

      if (isFlyingCheat && gameState === 'PLAYING') {
        const flicker = Math.random() * 18;
        ctx.fillStyle = '#ff3d00';
        ctx.fillRect(this.x - 36 - flicker, this.y + 15, 36 + flicker, 14);
        ctx.fillStyle = '#ffd54f';
        ctx.fillRect(this.x - 24 - flicker * 0.6, this.y + 18, 24 + flicker * 0.6, 8);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(this.x - 12, this.y + 20, 12, 4);

        ctx.fillStyle = '#00e5ff';
        ctx.fillRect(this.x + 10, this.y + 44, 16, 4 + Math.random() * 4);

        ctx.fillStyle = 'rgba(0, 229, 255, 0.65)';
        ctx.fillRect(this.x + 48, this.y + 2, 3, 38);
        ctx.fillRect(this.x + 52, this.y + 8, 2, 26);

        ctx.fillStyle = color;
      } else if (skin === 'COMBO_KING' && gameState === 'PLAYING') {
        ctx.fillStyle = frameCount % 4 < 2 ? '#ff9100' : '#ff1744';
        ctx.fillRect(this.x - 10, this.y + 20, 10, 6);
        ctx.fillRect(this.x - 16, this.y + 22, 6, 3);
        ctx.fillStyle = color;
      }

      if (skin === 'ASTRONAUT' && (!this.isDucking || !this.isGrounded || isDead)) {
        ctx.fillStyle = isNight ? 'rgba(128, 216, 255, 0.35)' : 'rgba(3, 169, 244, 0.25)';
        ctx.fillRect(this.x + 20, this.y - 3, 26, 23);
        ctx.fillStyle = color;
      }

      if (this.isDucking && this.isGrounded && !isDead && !isFlyingCheat) {
        const dy = 184;
        ctx.fillRect(this.x, dy + 10, 52, 16);
        ctx.fillRect(this.x + 36, dy + 4, 20, 12);
        ctx.fillStyle = bgColor;
        ctx.fillRect(this.x + 50, dy + 6, 2, 2);

        if (skin === 'COOL') {
          ctx.fillStyle = '#111';
          ctx.fillRect(this.x + 48, dy + 5, 8, 4);
        } else if (skin === 'DUCK_PRO') {
          ctx.fillStyle = '#ff1744';
          ctx.fillRect(this.x + 36, dy + 5, 20, 3);
          ctx.fillRect(this.x + 30, dy + 6, 6, 2);
        }

        ctx.fillStyle = color;
        if (this.legFrame < 5) {
          ctx.fillRect(this.x + 10, dy + 26, 4, 4);
        } else {
          ctx.fillRect(this.x + 32, dy + 26, 4, 4);
        }
      } else {
        const dx = this.x;
        const dy = this.y;

        ctx.fillRect(dx + 22, dy, 22, 18);
        if (isDead) {
          ctx.fillRect(dx + 26, dy + 14, 16, 3);
        } else {
          ctx.fillRect(dx + 26, dy + 12, 18, 4);
        }

        if (isDead) {
          ctx.fillStyle = bgColor;
          ctx.fillRect(dx + 25, dy + 3, 6, 6);
          ctx.fillStyle = color;
          ctx.fillRect(dx + 27, dy + 5, 2, 2);
        } else if (skin === 'COOL') {
          ctx.fillStyle = '#111';
          ctx.fillRect(dx + 24, dy + 3, 20, 5);
          ctx.fillStyle = '#fff';
          ctx.fillRect(dx + 27, dy + 4, 2, 2);
        } else if (skin === 'CYBER') {
          ctx.fillStyle = '#ff1744';
          ctx.fillRect(dx + 26, dy + 4, 5, 3);
        } else if (skin === 'DUCK_PRO') {
          ctx.fillStyle = '#ff1744';
          ctx.fillRect(dx + 22, dy + 3, 22, 3);
          ctx.fillRect(dx + 16, dy + 4, 6, 2);
          ctx.fillRect(dx + 14, dy + 6, 4, 2);
          ctx.fillStyle = '#fff';
          ctx.fillRect(dx + 27, dy + 4, 3, 2);
        } else {
          ctx.fillStyle = bgColor;
          ctx.fillRect(dx + 26, dy + 4, 3, 3);
        }

        if (skin === 'GENTLEMAN') {
          ctx.fillStyle = isNight ? '#ffd54f' : '#212121';
          ctx.fillRect(dx + 22, dy - 3, 20, 3);
          ctx.fillRect(dx + 26, dy - 12, 12, 9);
        } else if (skin === 'WIZARD') {
          ctx.fillStyle = '#7c4dff';
          ctx.fillRect(dx + 20, dy - 3, 24, 3);
          ctx.fillRect(dx + 24, dy - 9, 16, 6);
          ctx.fillRect(dx + 27, dy - 15, 10, 6);
          ctx.fillRect(dx + 30, dy - 20, 4, 5);
          ctx.fillStyle = '#ffd740';
          ctx.fillRect(dx + 29, dy - 8, 3, 3);
        } else if (skin === 'RAIN_FROG') {
          ctx.fillStyle = '#4caf50';
          ctx.fillRect(dx + 23, dy - 5, 7, 5);
          ctx.fillRect(dx + 34, dy - 5, 7, 5);
          ctx.fillStyle = '#fff';
          ctx.fillRect(dx + 25, dy - 4, 3, 3);
          ctx.fillRect(dx + 36, dy - 4, 3, 3);
          ctx.fillStyle = '#111';
          ctx.fillRect(dx + 26, dy - 3, 2, 2);
          ctx.fillRect(dx + 37, dy - 3, 2, 2);
        } else if (skin === 'GOLDEN') {
          ctx.fillStyle = '#ffab00';
          ctx.fillRect(dx + 24, dy - 4, 16, 4);
          ctx.fillRect(dx + 24, dy - 8, 3, 4);
          ctx.fillRect(dx + 30, dy - 9, 4, 5);
          ctx.fillRect(dx + 37, dy - 8, 3, 4);
        }

        ctx.fillStyle = color;
        ctx.fillRect(dx + 10, dy + 14, 20, 20);
        ctx.fillRect(dx + 4, dy + 18, 6, 12);
        ctx.fillRect(dx, dy + 22, 4, 6);
        ctx.fillRect(dx + 28, dy + 22, 4, 4);

        if (skin === 'CYBER') {
          ctx.fillStyle = bgColor;
          ctx.fillRect(dx + 14, dy + 18, 10, 2);
          ctx.fillRect(dx + 14, dy + 23, 10, 2);
        } else if (skin === 'ASTRONAUT') {
          ctx.fillStyle = '#cfd8dc';
          ctx.fillRect(dx + 4, dy + 14, 6, 14);
        } else if (skin === 'GOLDEN') {
          ctx.fillStyle = '#fff9c4';
          ctx.fillRect(dx + 16, dy + 19, 3, 3);
        }

        ctx.fillStyle = color;
        if (!this.isGrounded || isDead || isFlyingCheat) {
          ctx.fillRect(dx + 12, dy + 34, 4, 10);
          ctx.fillRect(dx + 22, dy + 34, 4, 10);
        } else {
          if (this.legFrame < 5) {
            ctx.fillRect(dx + 12, dy + 34, 4, 12);
            ctx.fillRect(dx + 14, dy + 44, 4, 2);
            ctx.fillRect(dx + 22, dy + 34, 4, 6);
          } else {
            ctx.fillRect(dx + 12, dy + 34, 4, 6);
            ctx.fillRect(dx + 22, dy + 34, 4, 12);
            ctx.fillRect(dx + 24, dy + 44, 4, 2);
          }
        }
      }

      ctx.restore();
    },
    jump() {
      if (isFlyingCheat) return;
      if (this.isGrounded) {
        this.velocityY = this.jumpPower;
        this.isGrounded = false;
        playJumpSound();

        if (weather === 'RAIN') {
          stats.totalRainJumps++;
          checkAchievements(Math.floor(score));
          saveStats();
        }

        if (weather === 'METEOR_SHOWER' && shootingStars.length > 0) {
          score += 50;
          stats.totalScore += 50;
          stats.totalWishes++;
          playScoreSound();
          spawnFloatingText('🌠 流星許願 +50!', this.x, this.y - 20, '#80d8ff');
          checkAchievements(Math.floor(score));
          saveStats();
        }
      }
    },
    update() {
      if (isFlyingCheat) {
        const remainMs = flyEndTime - Date.now();
        if (remainMs <= 0) {
          isFlyingCheat = false;
          landingGraceEndTime = Date.now() + 1500;
          this.velocityY = 0;
          updateCheatButtonUI();
        } else {
          if (remainMs < 1200) {
            boostMultiplier = 1.0 + 1.8 * (remainMs / 1200);
          } else {
            boostMultiplier = 2.8;
          }

          const targetFlyY = 44 + Math.sin(frameCount * 0.25) * 3;
          this.y += (targetFlyY - this.y) * 0.25;
          this.velocityY = 0;
          this.isGrounded = false;

          for (let i = 0; i < 3; i++) {
            jetParticles.push({
              x: this.x - 4,
              y: this.y + 18 + Math.random() * 10,
              vx: -7 - Math.random() * 8,
              vy: (Math.random() - 0.5) * 2.5,
              size: 2 + Math.random() * 4,
              life: 1.0,
              decay: 0.05 + Math.random() * 0.04,
              color: ['#ffffff', '#ffd54f', '#ff6d00', '#00e5ff'][Math.floor(Math.random() * 4)]
            });
          }

          if (frameCount % 2 === 0) {
            afterimages.push({ x: this.x, y: this.y, alpha: 0.45 });
          }

          if (Math.random() < 0.75) {
            speedLines.push({
              x: canvas.width + 20,
              y: 12 + Math.random() * 190,
              len: 45 + Math.random() * 75,
              speed: 26 + Math.random() * 14,
              alpha: 0.35 + Math.random() * 0.45
            });
          }

          if (frameCount % 5 === 0) {
            playJetThrusterHum();
          }

          updateCheatButtonUI();
          return;
        }
      } else {
        boostMultiplier += (1.0 - boostMultiplier) * 0.15;
      }

      if (!this.isGrounded) {
        this.velocityY += this.gravity;
        this.y += this.velocityY;
        if (this.y >= 164) {
          this.y = 164;
          this.velocityY = 0;
          this.isGrounded = true;
        }
      }
      this.legFrame = (this.legFrame + 1) % 10;
    }
  };

  let obstacles = [];
  function spawnObstacle() {
    const isBird = Math.random() < 0.35 && score > 200;
    if (!isBird) {
      const count = Math.floor(Math.random() * 3) + 1;
      obstacles.push({
        x: canvas.width,
        y: 166,
        width: count * 16 + 6,
        height: 44,
        type: 'CACTUS',
        count: count,
        nearMissChecked: false,
        duckChecked: false
      });
    } else {
      const birdY = Math.random() < 0.5 ? 125 : 160;
      obstacles.push({
        x: canvas.width,
        y: birdY,
        width: 38,
        height: 26,
        type: 'BIRD',
        wingFrame: 0,
        nearMissChecked: false,
        duckChecked: false
      });
    }
  }

  function drawCactus(obs) {
    ctx.fillStyle = isNight ? '#e8eaed' : '#535353';
    for (let c = 0; c < obs.count; c++) {
      const cx = obs.x + c * 16;
      const cy = obs.y;
      ctx.fillRect(cx + 4, cy, 8, 44);
      ctx.fillRect(cx, cy + 12, 4, 14);
      ctx.fillRect(cx, cy + 22, 8, 4);
      ctx.fillRect(cx + 12, cy + 18, 4, 14);
      ctx.fillRect(cx + 8, cy + 28, 8, 4);
    }
  }

  function drawBird(obs) {
    ctx.fillStyle = isNight ? '#e8eaed' : '#535353';
    const bx = obs.x;
    const by = obs.y;
    ctx.fillRect(bx + 10, by + 10, 20, 10);
    ctx.fillRect(bx, by + 6, 10, 6);
    ctx.fillRect(bx + 30, by + 12, 8, 4);

    obs.wingFrame = (obs.wingFrame + 1) % 12;
    if (obs.wingFrame < 6) {
      ctx.fillRect(bx + 14, by, 6, 10);
      ctx.fillRect(bx + 16, by - 4, 4, 4);
    } else {
      ctx.fillRect(bx + 14, by + 18, 6, 10);
      ctx.fillRect(bx + 16, by + 26, 4, 4);
    }
  }

  function drawRestartIcon(x, y, themeColor, bgColor) {
    ctx.fillStyle = themeColor;
    ctx.fillRect(x, y + 2, 34, 26);
    ctx.fillRect(x + 2, y, 30, 30);
    ctx.fillStyle = bgColor;
    ctx.fillRect(x + 3, y + 3, 28, 24);
    ctx.fillStyle = themeColor;
    ctx.fillRect(x + 12, y + 8, 10, 3);
    ctx.fillRect(x + 10, y + 11, 3, 8);
    ctx.fillRect(x + 12, y + 19, 10, 3);
    ctx.fillRect(x + 21, y + 15, 3, 4);
    ctx.fillRect(x + 20, y + 6, 3, 7);
    ctx.fillRect(x + 23, y + 8, 2, 3);
  }

  onValue(leaderboardRef, (snapshot) => {
    const data = snapshot.val();
    globalScores = [];
    if (data) {
      Object.keys(data).forEach(key => {
        globalScores.push(data[key]);
      });
      globalScores.sort((a, b) => b.score - a.score);
    }
    updateLeaderboardUI();
    if (globalScores.length > 0) {
      highScore = globalScores[0].score;
    }
  });

  function updateLeaderboardUI() {
    leaderboardList.innerHTML = '';
    const top10 = globalScores.slice(0, 10);
    if (top10.length === 0) {
      leaderboardList.innerHTML = '<li>尚未有紀錄</li>';
      return;
    }
    top10.forEach((item, index) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${index + 1}. ${item.name}</span><span>${String(item.score).padStart(5, '0')}</span>`;
      leaderboardList.appendChild(li);
    });
  }

  function handlePrimaryAction() {
    if (isModalOpen()) return;

    if (gameState === 'PLAYING') {
      dino.jump();
    } else if (gameState === 'START' || gameState === 'GAMEOVER') {
      resetGame();
    }
  }

  window.addEventListener('keydown', (e) => {
    if (isModalOpen()) return;

    if (e.code === 'KeyF' && gameState === 'PLAYING' && isFlyCheatUnlocked) {
      e.preventDefault();
      activateCheatFly();
    }
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      handlePrimaryAction();
    }
    if (e.code === 'ArrowDown' && gameState === 'PLAYING' && !isFlyingCheat) {
      dino.isDucking = true;
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowDown') {
      dino.isDucking = false;
    }
  });

  canvas.addEventListener('touchstart', (e) => {
    if (isModalOpen()) return;
    e.preventDefault();
    handlePrimaryAction();
  }, { passive: false });

  canvas.addEventListener('mousedown', (e) => {
    if (isModalOpen()) return;
    if (e.button === 0) {
      handlePrimaryAction();
    }
  });

  function resetGame() {
    score = 0;
    currentSpeed = initialSpeed;
    obstacles = [];
    volcanoMeteors = [];
    shootingStars = [];
    floatingTexts = [];
    jetParticles = [];
    sonicRings = [];
    speedLines = [];
    afterimages = [];
    nearMissCombo = 0;
    nextLandmarkScore = 100;
    pendingLandmark = false;

    isFlyingCheat = false;
    flyEndTime = 0;
    landingGraceEndTime = 0;
    usedCheatThisRun = false;
    boostMultiplier = 1.0;
    screenShake = 0;
    sonicFlashAlpha = 0;

    initCityBuildings();
    dino.y = 164;
    dino.velocityY = 0;
    dino.isGrounded = true;
    dino.isDucking = false;
    gameState = 'PLAYING';
    weather = 'CLEAR';
    isNight = false;
    document.body.classList.remove('night', 'meteor-mode');
    updateCheatButtonUI();
  }

  function getDinoHitbox(dinoObj) {
    return dinoObj.isDucking && dinoObj.isGrounded
      ? { x: dinoObj.x + 8, y: 196, width: 38, height: 12 }
      : { x: dinoObj.x + 12, y: dinoObj.y + 8, width: 22, height: 32 };
  }

  function checkCollision(dinoObj, obs) {
    if (isFlyingCheat || Date.now() < landingGraceEndTime) return false;

    const dinoHitbox = getDinoHitbox(dinoObj);
    const obsHitbox = obs.type === 'CACTUS'
      ? { x: obs.x + 5, y: obs.y + 6, width: Math.max(6, obs.width - 10), height: obs.height - 8 }
      : { x: obs.x + 6, y: obs.y + 8, width: obs.width - 12, height: obs.height - 12 };

    return (
      dinoHitbox.x < obsHitbox.x + obsHitbox.width &&
      dinoHitbox.x + dinoHitbox.width > obsHitbox.x &&
      dinoHitbox.y < obsHitbox.y + obsHitbox.height &&
      dinoHitbox.y + dinoHitbox.height > obsHitbox.y
    );
  }

  function checkNearMiss(dinoObj, obs) {
    if (isFlyingCheat) return;

    const dinoHitbox = getDinoHitbox(dinoObj);

    if (!obs.duckChecked && obs.type === 'BIRD' && obs.x + obs.width < dinoHitbox.x) {
      obs.duckChecked = true;
      if (dinoObj.isDucking && dinoObj.isGrounded) {
        stats.totalBirdDucks++;
        checkAchievements(Math.floor(score));
        saveStats();
      }
    }

    if (obs.nearMissChecked) return;
    if (obs.x + obs.width < dinoHitbox.x) {
      obs.nearMissChecked = true;
      const verticalGap = Math.abs((dinoHitbox.y + dinoHitbox.height) - obs.y);
      if (verticalGap < 26) {
        nearMissCombo++;
        stats.totalNearMiss++;
        if (nearMissCombo > stats.maxCombo) {
          stats.maxCombo = nearMissCombo;
        }
        const bonus = 20 * Math.min(nearMissCombo, 5);
        score += bonus;
        stats.totalScore += bonus;
        playNearMissSound();
        const label = nearMissCombo > 1 ? `CLOSE x${nearMissCombo}! +${bonus}` : `CLOSE! +${bonus}`;
        spawnFloatingText(label, dinoObj.x + 10, dinoObj.y - 12, '#ff9800');
        checkAchievements(Math.floor(score));
        saveStats();
      } else {
        nearMissCombo = 0;
      }
    }
  }

  function handleGameOver() {
    gameState = 'GAMEOVER';
    isFlyingCheat = false;
    boostMultiplier = 1.0;
    updateCheatButtonUI();
    playHitSound();

    stats.gamesPlayed++;
    const currentScoreInt = Math.floor(score);
    checkAchievements(currentScoreInt);
    saveStats();

    if (usedCheatThisRun) {
      showToast('🚫 本局使用過噴射暴衝，成績不列入排行榜');
      return;
    }

    const currentName = getActivePlayerName();
    nameInput.value = currentName === '無名氏' ? '' : currentName;

    const isTopScore = globalScores.length < 10 || currentScoreInt > (globalScores[9]?.score || 0);

    if (isTopScore && currentScoreInt > 0) {
      nameModal.style.display = 'block';
      setTimeout(() => nameInput.focus(), 50);
    }
  }

  function submitLeaderboardName() {
    if (usedCheatThisRun) return;
    const name = nameInput.value.trim() || '無名氏';
    setPlayerName(name);
    const currentScoreInt = Math.floor(score);
    
    const newScoreRef = ref(db, 'leaderboard/' + Date.now());
    set(newScoreRef, {
      name: getActivePlayerName(),
      score: currentScoreInt,
      uid: currentUser ? currentUser.uid : null
    });

    nameModal.style.display = 'none';
    nameInput.blur();
  }

  submitBtn.addEventListener('click', submitLeaderboardName);
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitLeaderboardName();
    }
  });

  function update() {
    frameCount++;

    if (screenShake > 0) {
      screenShake = Math.max(0, screenShake - 0.8);
    }
    if (sonicFlashAlpha > 0) {
      sonicFlashAlpha = Math.max(0, sonicFlashAlpha - 0.045);
    }

    if (gameState === 'PLAYING') {
      const currentScoreInt = Math.floor(score);
      const baseSpeed = Math.min(initialSpeed + currentScoreInt * 0.008, maxSpeed);
      currentSpeed = baseSpeed * boostMultiplier;

      const scoreGain = 0.15 * boostMultiplier;
      score += scoreGain;
      stats.totalScore += scoreGain;
      const updatedScoreInt = Math.floor(score);

      if (updatedScoreInt >= nextLandmarkScore) {
        pendingLandmark = true;
        nextLandmarkScore += 100;
      }

      if (updatedScoreInt > 0 && updatedScoreInt % 100 === 0 && Math.floor(score - scoreGain) % 100 !== 0) {
        playScoreSound();
        checkAchievements(updatedScoreInt);
      }

      updateWeatherState(updatedScoreInt);
      dino.update();

      cityBuildings.forEach(b => {
        b.x -= currentSpeed * 0.15;
      });
      if (cityBuildings.length > 0 && cityBuildings[0].x + cityBuildings[0].width < -20) {
        const lastB = cityBuildings[cityBuildings.length - 1];
        cityBuildings.shift();
        const nextItem = createCityElement(lastB.x + lastB.width + 10 + Math.floor(Math.random() * 16));
        cityBuildings.push(nextItem);
      }

      clouds.forEach(cloud => {
        cloud.x -= currentSpeed * 0.25;
        if (cloud.x + 50 < 0) {
          cloud.x = canvas.width + Math.random() * 120;
          cloud.y = 40 + Math.random() * 60;
        }
      });

      if (weather === 'RAIN') {
        rainDrops.forEach(r => {
          r.x -= 3 + (isFlyingCheat ? 10 : 0);
          r.y += r.speed;
          if (r.y > groundOffset) {
            r.y = -10;
            r.x = Math.random() * (canvas.width + 100);
          }
        });
        if (Math.random() < 0.005) {
          lightningAlpha = 0.65;
        }
      }
      if (lightningAlpha > 0) {
        lightningAlpha = Math.max(0, lightningAlpha - 0.05);
      }

      if (weather === 'METEOR_SHOWER' && Math.random() < 0.015) {
        shootingStars.push({
          x: 300 + Math.random() * 500,
          y: 10 + Math.random() * 40,
          vx: -9 - Math.random() * 4,
          vy: 4 + Math.random() * 2,
          life: 45
        });
      }
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const s = shootingStars[i];
        s.x += s.vx;
        s.y += s.vy;
        s.life--;
        if (s.life <= 0) shootingStars.splice(i, 1);
      }

      if (weather === 'VOLCANO' && frameCount % 95 === 0 && Math.random() < 0.7) {
        const targetX = 160 + Math.random() * 450;
        volcanoMeteors.push({
          x: targetX + 180,
          y: -20,
          targetX: targetX,
          vx: -3.2,
          vy: 3.8,
          radius: 8
        });
      }
      for (let i = volcanoMeteors.length - 1; i >= 0; i--) {
        const m = volcanoMeteors[i];
        m.x += m.vx - (isFlyingCheat ? currentSpeed * 0.4 : 0);
        m.y += m.vy;

        if (!isFlyingCheat && Date.now() >= landingGraceEndTime) {
          const dBox = getDinoHitbox(dino);
          if (
            m.x - 5 < dBox.x + dBox.width &&
            m.x + 5 > dBox.x &&
            m.y - 5 < dBox.y + dBox.height &&
            m.y + 5 > dBox.y
          ) {
            handleGameOver();
          }
        }

        if (m.y >= groundOffset) {
          volcanoMeteors.splice(i, 1);
        }
      }

      terrainBumps.forEach(bump => {
        bump.x -= currentSpeed;
        if (bump.x + bump.width < 0) {
          bump.x = canvas.width + Math.random() * 100;
          bump.type = Math.random() > 0.4 ? 'HILL' : 'PIT';
          bump.width = 24 + Math.floor(Math.random() * 16);
        }
      });

      groundDots.forEach(dot => {
        dot.x -= currentSpeed;
        if (dot.x < 0) dot.x = canvas.width;
      });

      const spawnInterval = Math.max(22, Math.floor(110 - currentSpeed * 3));
      if (frameCount % spawnInterval === 0) {
        if (Math.random() < 0.65) spawnObstacle();
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= currentSpeed;

        if (checkCollision(dino, obstacles[i])) {
          handleGameOver();
        } else {
          checkNearMiss(dino, obstacles[i]);
        }

        if (obstacles[i].x + obstacles[i].width < 0) {
          obstacles.splice(i, 1);
        }
      }
    }

    for (let i = jetParticles.length - 1; i >= 0; i--) {
      const p = jetParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) jetParticles.splice(i, 1);
    }

    for (let i = sonicRings.length - 1; i >= 0; i--) {
      const r = sonicRings[i];
      r.radius += 7.5;
      r.x -= 2.5;
      r.alpha -= 0.04;
      if (r.alpha <= 0) sonicRings.splice(i, 1);
    }

    for (let i = afterimages.length - 1; i >= 0; i--) {
      const a = afterimages[i];
      a.x -= 6.5;
      a.alpha -= 0.045;
      if (a.alpha <= 0) afterimages.splice(i, 1);
    }

    for (let i = speedLines.length - 1; i >= 0; i--) {
      const sl = speedLines[i];
      sl.x -= sl.speed;
      if (sl.x + sl.len < 0) speedLines.splice(i, 1);
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      floatingTexts[i].y -= 0.8;
      floatingTexts[i].alpha -= 0.02;
      if (floatingTexts[i].alpha <= 0) {
        floatingTexts.splice(i, 1);
      }
    }
  }

  function draw() {
    ctx.save();

    if (screenShake > 0) {
      const sx = (Math.random() - 0.5) * screenShake;
      const sy = (Math.random() - 0.5) * screenShake;
      ctx.translate(sx, sy);
    } else if (isFlyingCheat && gameState === 'PLAYING') {
      const engineShakeY = (Math.random() - 0.5) * 1.8;
      ctx.translate(0, engineShakeY);
    }

    ctx.clearRect(-20, -20, canvas.width + 40, canvas.height + 40);

    const themeColor = isNight ? '#e8eaed' : '#535353';
    const bgColor = weather === 'VOLCANO' ? '#2b1818' : (isNight ? '#202124' : '#f7f7f7');

    if (sonicFlashAlpha > 0) {
      ctx.fillStyle = `rgba(255, 213, 79, ${sonicFlashAlpha})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    if (lightningAlpha > 0) {
      ctx.fillStyle = `rgba(255, 255, 255, ${lightningAlpha})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    if (isNight) {
      ctx.fillStyle = '#e8eaed';
      stars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));
      ctx.fillRect(680, 40, 20, 20);
      ctx.fillStyle = bgColor;
      ctx.fillRect(676, 36, 12, 12);
    }

    shootingStars.forEach(s => {
      ctx.fillStyle = '#80d8ff';
      ctx.fillRect(s.x, s.y, 4, 4);
      ctx.fillStyle = 'rgba(128, 216, 255, 0.45)';
      ctx.fillRect(s.x + 4, s.y - 2, 10, 2);
      ctx.fillRect(s.x + 14, s.y - 4, 12, 2);
    });

    drawCityBackground();
    clouds.forEach(cloud => drawCloud(cloud));

    speedLines.forEach(sl => {
      ctx.fillStyle = isNight
        ? `rgba(0, 229, 255, ${sl.alpha})`
        : `rgba(255, 109, 0, ${sl.alpha})`;
      ctx.fillRect(sl.x, sl.y, sl.len, 2);
    });

    if (weather === 'RAIN') {
      ctx.fillStyle = isNight ? 'rgba(128, 216, 255, 0.5)' : 'rgba(83, 83, 83, 0.45)';
      rainDrops.forEach(r => {
        ctx.fillRect(r.x, r.y, 1.5, r.len);
      });
    }

    drawTerrain(themeColor, bgColor);

    volcanoMeteors.forEach(m => {
      if (Math.floor(frameCount / 6) % 2 === 0) {
        ctx.fillStyle = '#ff1744';
        ctx.fillRect(m.targetX - 10, groundOffset - 2, 20, 4);
      }
      ctx.fillStyle = '#ff9100';
      ctx.fillRect(m.x + 4, m.y - 8, 8, 8);
      ctx.fillStyle = '#ff1744';
      ctx.fillRect(m.x - 5, m.y - 5, 10, 10);
      ctx.fillStyle = '#ffd54f';
      ctx.fillRect(m.x - 2, m.y - 2, 4, 4);
    });

    sonicRings.forEach(r => {
      ctx.save();
      ctx.strokeStyle = `rgba(0, 229, 255, ${r.alpha})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    });

    jetParticles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
      ctx.restore();
    });

    afterimages.forEach(a => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, a.alpha);
      ctx.fillStyle = '#00e5ff';
      ctx.fillRect(a.x + 22, a.y, 22, 18);
      ctx.fillRect(a.x + 10, a.y + 14, 20, 20);
      ctx.fillRect(a.x + 4, a.y + 18, 6, 12);
      ctx.restore();
    });

    dino.draw();
    obstacles.forEach(obs => {
      if (obs.type === 'CACTUS') drawCactus(obs);
      else drawBird(obs);
    });

    floatingTexts.forEach(ft => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.alpha);
      ctx.fillStyle = ft.color;
      ctx.font = 'bold 14px "Courier New", monospace';
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    });

    ctx.fillStyle = themeColor;
    ctx.font = '700 18px "Courier New", monospace';
    const displayScore = String(Math.floor(score)).padStart(5, '0');
    const displayHigh = String(Math.floor(highScore)).padStart(5, '0');
    ctx.fillText(`HI ${displayHigh}  ${displayScore}`, canvas.width - 190, 35);

    ctx.font = 'bold 12px "Courier New", monospace';
    const weatherLabels = {
      CLEAR: '☀️ 晴朗城市',
      RAIN: '⛈️ 像素雷雨',
      METEOR_SHOWER: '☄️ 流星雨之夜',
      VOLCANO: '🌋 火山隕石雨'
    };
    ctx.fillText(weatherLabels[weather], 15, 25);

    if (usedCheatThisRun) {
      ctx.fillStyle = '#ff5252';
      ctx.fillText('🚫 已使用噴射外掛（本局不計入排行榜）', 15, 43);
    }
    if (isFlyingCheat && gameState === 'PLAYING') {
      const remainRatio = Math.max(0, (flyEndTime - Date.now()) / 10000);
      ctx.fillStyle = 'rgba(255, 109, 0, 0.25)';
      ctx.fillRect(15, 50, 150, 7);
      ctx.fillStyle = '#ff6d00';
      ctx.fillRect(15, 50, 150 * remainRatio, 7);
      ctx.fillStyle = '#ff6d00';
      ctx.fillText(`🔥 TURBO ${boostMultiplier.toFixed(1)}x`, 172, 57);
    }

    ctx.fillStyle = themeColor;
    ctx.font = '700 18px "Courier New", monospace';
    if (gameState === 'START') {
      ctx.fillText('按下 [Space] 或點擊螢幕開始遊戲', canvas.width / 2 - 175, 110);
    } else if (gameState === 'GAMEOVER') {
      ctx.fillText('G A M E   O V E R', canvas.width / 2 - 100, 95);
      drawRestartIcon(canvas.width / 2 - 17, 112, themeColor, bgColor);
    }

    ctx.restore();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
