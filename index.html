<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沙沙dino jump game 🎮 世界地標環遊版</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #f7f7f7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      color: #535353;
      transition: background-color 0.5s, color 0.5s;
    }
    body.night {
      background-color: #202124;
      color: #e8eaed;
    }
    body.meteor-mode {
      background-color: #2b1818;
      color: #ffdad6;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      padding: 20px;
    }
    canvas {
      background-color: transparent;
      display: block;
      margin: 0 auto;
      max-width: 100%;
      cursor: pointer;
    }
    #ui-panel {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-top: 15px;
      font-weight: bold;
      flex-wrap: wrap;
    }
    .panel-box {
      background: rgba(0, 0, 0, 0.05);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
    }
    body.night .panel-box, body.meteor-mode .panel-box {
      background: rgba(255, 255, 255, 0.08);
    }
    .panel-box h4 {
      margin-bottom: 8px;
      border-bottom: 2px dashed currentColor;
      padding-bottom: 4px;
    }
    #controls-info {
      flex: 1;
      min-width: 240px;
      line-height: 1.6;
    }
    #skin-selector {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .skin-btn {
      padding: 5px 9px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      border: 2px solid currentColor;
      border-radius: 5px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      opacity: 0.5;
      transition: all 0.2s;
    }
    .skin-btn.unlocked {
      opacity: 1;
    }
    .skin-btn.active {
      background: #535353;
      color: #fff;
    }
    body.night .skin-btn.active, body.meteor-mode .skin-btn.active {
      background: #e8eaed;
      color: #202124;
    }
    #leaderboard-box {
      min-width: 230px;
    }
    #leaderboard-list {
      list-style: none;
    }
    #leaderboard-list li {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
    }
    #achievement-toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #333;
      color: #ffd700;
      border: 2px solid #ffd700;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 50;
      pointer-events: none;
    }
    #achievement-toast.show {
      transform: translateX(-50%) translateY(0);
    }
    #name-modal {
      display: none;
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      color: #333;
      padding: 25px;
      border: 3px solid #535353;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      text-align: center;
      z-index: 10;
    }
    body.night #name-modal, body.meteor-mode #name-modal {
      background: #2b2c2f;
      color: #fff;
      border-color: #e8eaed;
    }
    #name-modal input {
      padding: 10px;
      margin: 12px 0;
      font-size: 16px;
      font-family: inherit;
      width: 80%;
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
      user-select: text;
    }
    #name-modal button {
      padding: 9px 20px;
      font-size: 14px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      background: #535353;
      color: #fff;
      border: none;
      border-radius: 6px;
    }
    body.night #name-modal button, body.meteor-mode #name-modal button {
      background: #e8eaed;
      color: #202124;
    }
  </style>
</head>
<body>

<div id="achievement-toast">🏆 成就解鎖！</div>

<div id="game-container">
  <canvas id="gameCanvas" width="800" height="250"></canvas>
  
  <div id="ui-panel">
    <div id="controls-info" class="panel-box">
      <h4>🎮 操作與特色玩法</h4>
      <p>• [Space] / [↑] / 點擊：跳躍 / 重來</p>
      <p>• [↓] 按住：蹲下避開高空飛鳥</p>
      <p>• <b>極限擦身</b>：貼近障礙起跳觸發 COMBO 加分</p>
      <p>• <b>流星許願</b>：流星雨之夜跳躍獲 +50 分</p>
      <p>• <b>地標巡禮</b>：每突破 100 分出現一座世界地標</p>
      
      <h4 style="margin-top: 10px;">🦖 恐龍造型（達成條件自動解鎖）</h4>
      <div id="skin-selector">
        <button class="skin-btn unlocked active" data-skin="DEFAULT">🦖 經典恐龍</button>
        <button class="skin-btn" data-skin="COOL" title="累計擦身 10 次解鎖">🔒 墨鏡酷龍 (0/10擦身)</button>
        <button class="skin-btn" data-skin="GENTLEMAN" title="單場突破 500 分解鎖">🔒 紳士恐龍 (單場500分)</button>
        <button class="skin-btn" data-skin="CYBER" title="累積總分達 3000 分解鎖">🔒 機械暴龍 (0/3000總分)</button>
      </div>
    </div>

    <div id="leaderboard-box" class="panel-box">
      <h4>🏆 全域前 10 名排行榜</h4>
      <ol id="leaderboard-list">
        <li>載入中...</li>
      </ol>
    </div>
  </div>

  <div id="name-modal">
    <h3>🎉 榮登高分榜！</h3>
    <p>請輸入您的名字紀錄戰績：</p>
    <input type="text" id="player-name-input" maxlength="10" placeholder="您的名字">
    <br>
    <button id="submit-name-btn">確認送出</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBZ9s5Ku8aEzaVEmk_7ztbIiHXI6qmz5H0",
    authDomain: "my-project-zack0512.firebaseapp.com",
    databaseURL: "https://my-project-zack0512-default-rtdb.firebaseio.com",
    projectId: "my-project-zack0512",
    storageBucket: "my-project-zack0512.firebasestorage.app",
    messagingSenderId: "972310414233",
    appId: "1:972310414233:web:4014908a1e187754530908",
    measurementId: "G-YKEN22N04Y"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const leaderboardRef = ref(db, 'leaderboard');

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const nameModal = document.getElementById('name-modal');
  const nameInput = document.getElementById('player-name-input');
  const submitBtn = document.getElementById('submit-name-btn');
  const leaderboardList = document.getElementById('leaderboard-list');
  const toastEl = document.getElementById('achievement-toast');

  let gameState = 'START';
  let score = 0;
  let highScore = 0;
  let globalScores = [];
  let currentSpeed = 6;
  const initialSpeed = 6;
  const maxSpeed = 22;
  let frameCount = 0;

  // ==========================================
  // 成就與造型存檔系統 (LocalStorage)
  // ==========================================
  let stats = JSON.parse(localStorage.getItem('dino_stats_v1')) || {
    totalScore: 0,
    totalNearMiss: 0,
    maxSingleScore: 0,
    unlockedSkins: ['DEFAULT'],
    selectedSkin: 'DEFAULT'
  };

  function saveStats() {
    localStorage.setItem('dino_stats_v1', JSON.stringify(stats));
    updateSkinButtonsUI();
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    playAchievementSound();
    setTimeout(() => {
      toastEl.classList.remove('show');
    }, 3200);
  }

  function checkAchievements(currentRunScore) {
    let newlyUnlocked = false;
    if (currentRunScore > stats.maxSingleScore) {
      stats.maxSingleScore = currentRunScore;
    }

    if (stats.totalNearMiss >= 10 && !stats.unlockedSkins.includes('COOL')) {
      stats.unlockedSkins.push('COOL');
      showToast('🏆 成就解鎖：【墨鏡酷龍】已開放使用！');
      newlyUnlocked = true;
    }
    if (stats.maxSingleScore >= 500 && !stats.unlockedSkins.includes('GENTLEMAN')) {
      stats.unlockedSkins.push('GENTLEMAN');
      showToast('🏆 成就解鎖：【紳士恐龍】已開放使用！');
      newlyUnlocked = true;
    }
    if (stats.totalScore >= 3000 && !stats.unlockedSkins.includes('CYBER')) {
      stats.unlockedSkins.push('CYBER');
      showToast('🏆 成就解鎖：【機械暴龍】已開放使用！');
      newlyUnlocked = true;
    }
    if (newlyUnlocked) saveStats();
  }

  function updateSkinButtonsUI() {
    const buttons = document.querySelectorAll('.skin-btn');
    buttons.forEach(btn => {
      const skin = btn.dataset.skin;
      const isUnlocked = stats.unlockedSkins.includes(skin);
      btn.classList.toggle('unlocked', isUnlocked);
      btn.classList.toggle('active', stats.selectedSkin === skin);

      if (skin === 'COOL') {
        btn.textContent = isUnlocked ? '🕶️ 墨鏡酷龍' : `🔒 墨鏡酷龍 (${Math.min(10, stats.totalNearMiss)}/10擦身)`;
      } else if (skin === 'GENTLEMAN') {
        btn.textContent = isUnlocked ? '🎩 紳士恐龍' : `🔒 紳士恐龍 (單場500分)`;
      } else if (skin === 'CYBER') {
        btn.textContent = isUnlocked ? '🤖 機械暴龍' : `🔒 機械暴龍 (${Math.min(3000, Math.floor(stats.totalScore))}/3000總分)`;
      }
    });
  }

  document.querySelectorAll('.skin-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const skin = btn.dataset.skin;
      if (stats.unlockedSkins.includes(skin)) {
        stats.selectedSkin = skin;
        saveStats();
      } else {
        showToast('🔒 尚未達成該造型的解鎖條件喔！');
      }
    });
  });

  updateSkinButtonsUI();

  function isModalOpen() {
    return nameModal.style.display === 'block' || document.activeElement === nameInput;
  }

  // ==========================================
  // 天氣與特殊事件系統
  // ==========================================
  let weather = 'CLEAR';
  let isNight = false;
  let lightningAlpha = 0;

  let rainDrops = Array.from({length: 65}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * 210,
    len: 8 + Math.random() * 6,
    speed: 9 + Math.random() * 4
  }));

  let shootingStars = [];
  let volcanoMeteors = [];
  let floatingTexts = [];

  function spawnFloatingText(text, x, y, color = '#ff9800') {
    floatingTexts.push({ text, x, y, alpha: 1.0, color });
  }

  function updateWeatherState(currentScoreInt) {
    const phase = Math.floor(currentScoreInt / 400) % 4;
    let targetWeather = 'CLEAR';
    let targetNight = false;

    if (phase === 0) {
      targetWeather = 'CLEAR';
      targetNight = false;
    } else if (phase === 1) {
      targetWeather = 'RAIN';
      targetNight = false;
    } else if (phase === 2) {
      targetWeather = 'METEOR_SHOWER';
      targetNight = true;
    } else if (phase === 3) {
      targetWeather = currentScoreInt >= 800 ? 'VOLCANO' : 'METEOR_SHOWER';
      targetNight = true;
    }

    if (weather !== targetWeather || isNight !== targetNight) {
      weather = targetWeather;
      isNight = targetNight;
      document.body.classList.remove('night', 'meteor-mode');
      if (weather === 'VOLCANO') {
        document.body.classList.add('meteor-mode');
        spawnFloatingText('🌋 警告：火山隕石雨來襲！', canvas.width / 2 - 120, 75, '#ff5252');
      } else if (isNight) {
        document.body.classList.add('night');
        if (weather === 'METEOR_SHOWER') {
          spawnFloatingText('☄️ 流星雨之夜：看到流星快跳躍！', canvas.width / 2 - 140, 75, '#80d8ff');
        }
      } else if (weather === 'RAIN') {
        spawnFloatingText('⛈️ 像素雷雨天來臨！', canvas.width / 2 - 90, 75, '#4fc3f7');
      }
    }
  }

  // ==========================================
  // 雙層視差背景：每 100 分出現一座世界地標 + 一般大樓
  // ==========================================
  const groundOffset = 210;

  const LANDMARK_TYPES = [
    'TAIPEI_101',     // 台北 101
    'EIFFEL',         // 巴黎艾菲爾鐵塔
    'TOKYO_TOWER',    // 東京鐵塔
    'EMPIRE_STATE',   // 紐約帝國大廈
    'BIG_BEN',        // 倫敦大笨鐘
    'SYDNEY_OPERA',   // 雪梨歌劇院
    'PYRAMIDS'        // 埃及金字塔
  ];
  let landmarkQueue = [...LANDMARK_TYPES];
  let nextLandmarkScore = 100; // 下一個觸發地標的分數門檻
  let pendingLandmark = false; // 是否有排隊等待生成的地標

  function createCityElement(startX, forceNormal = false) {
    // 只有當分數跨越 100 的倍數（pendingLandmark 為 true）且非強制普通建築時，才生成地標
    if (!forceNormal && pendingLandmark) {
      pendingLandmark = false;
      if (landmarkQueue.length === 0) {
        landmarkQueue = [...LANDMARK_TYPES];
      }
      const idx = Math.floor(Math.random() * landmarkQueue.length);
      const type = landmarkQueue.splice(idx, 1)[0];

      const widths = {
        TAIPEI_101: 38,
        EIFFEL: 48,
        TOKYO_TOWER: 44,
        EMPIRE_STATE: 36,
        BIG_BEN: 28,
        SYDNEY_OPERA: 68,
        PYRAMIDS: 76
      };
      return {
        x: startX,
        width: widths[type] || 40,
        type: type
      };
    }

    // 普通現代大樓
    const w = 24 + Math.floor(Math.random() * 24);
    const h = 24 + Math.floor(Math.random() * 44);
    return {
      x: startX,
      width: w,
      height: h,
      type: 'NORMAL',
      hasAntenna: Math.random() > 0.65,
      windows: Array.from({length: Math.floor(h / 12)}, (_, row) => ({
        row,
        lit: Math.random() > 0.4
      }))
    };
  }

  let cityBuildings = [];
  function initCityBuildings() {
    cityBuildings = [];
    let nextCityX = 20;
    while (nextCityX < canvas.width + 250) {
      // 開場畫面只放普通大樓，等跑滿 100 分才開始出現地標
      const item = createCityElement(nextCityX, true);
      cityBuildings.push(item);
      nextCityX += item.width + 10 + Math.floor(Math.random() * 16);
    }
  }
  initCityBuildings();

  let clouds = Array.from({length: 4}, (_, i) => ({
    x: 150 + i * 220 + Math.random() * 60,
    y: 45 + Math.random() * 55
  }));

  let terrainBumps = Array.from({length: 5}, (_, i) => ({
    x: 100 + i * 190 + Math.random() * 50,
    type: Math.random() > 0.4 ? 'HILL' : 'PIT',
    width: 24 + Math.floor(Math.random() * 16)
  }));

  let groundDots = Array.from({length: 30}, () => ({
    x: Math.random() * canvas.width,
    y: groundOffset + 5 + Math.random() * 18,
    size: Math.random() > 0.5 ? 2 : 4
  }));

  const stars = Array.from({length: 20}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * 110,
    size: Math.random() > 0.5 ? 2 : 3
  }));

  // 繪製世界知名都市地標與背景建築
  function drawCityBackground() {
    const cityColor = isNight ? 'rgba(232, 234, 237, 0.16)' : 'rgba(83, 83, 83, 0.17)';
    const accentColor = isNight ? 'rgba(255, 224, 102, 0.45)' : 'rgba(83, 83, 83, 0.28)';
    const bgColor = weather === 'VOLCANO' ? '#2b1818' : (isNight ? '#202124' : '#f7f7f7');

    cityBuildings.forEach(b => {
      const bx = Math.floor(b.x);
      ctx.fillStyle = cityColor;

      if (b.type === 'TAIPEI_101') {
        ctx.fillRect(bx + 6, groundOffset - 22, 26, 22);
        for (let i = 0; i < 6; i++) {
          const segY = groundOffset - 32 - i * 10;
          ctx.fillRect(bx + 8, segY, 22, 8);
          ctx.fillRect(bx + 10, segY + 8, 18, 2);
          if (isNight) {
            ctx.fillStyle = i % 2 === 0 ? 'rgba(105, 240, 174, 0.45)' : 'rgba(255, 238, 88, 0.45)';
            ctx.fillRect(bx + 12, segY + 2, 14, 2);
            ctx.fillStyle = cityColor;
          }
        }
        ctx.fillRect(bx + 13, groundOffset - 98, 12, 6);
        ctx.fillRect(bx + 17, groundOffset - 114, 4, 16);
        ctx.fillRect(bx + 18, groundOffset - 122, 2, 8);

      } else if (b.type === 'EIFFEL') {
        ctx.fillRect(bx + 2, groundOffset - 14, 10, 14);
        ctx.fillRect(bx + 36, groundOffset - 14, 10, 14);
        ctx.fillRect(bx + 6, groundOffset - 28, 10, 14);
        ctx.fillRect(bx + 32, groundOffset - 28, 10, 14);
        ctx.fillRect(bx + 6, groundOffset - 32, 36, 4);
        ctx.fillRect(bx + 12, groundOffset - 56, 24, 24);
        ctx.fillStyle = bgColor;
        ctx.fillRect(bx + 19, groundOffset - 52, 10, 18);
        ctx.fillStyle = cityColor;
        ctx.fillRect(bx + 12, groundOffset - 60, 24, 4);
        ctx.fillRect(bx + 17, groundOffset - 86, 14, 26);
        ctx.fillRect(bx + 20, groundOffset - 104, 8, 18);
        ctx.fillRect(bx + 23, groundOffset - 116, 2, 12);

      } else if (b.type === 'TOKYO_TOWER') {
        ctx.fillRect(bx + 2, groundOffset - 16, 12, 16);
        ctx.fillRect(bx + 30, groundOffset - 16, 12, 16);
        ctx.fillRect(bx + 8, groundOffset - 38, 28, 22);
        ctx.fillStyle = bgColor;
        ctx.fillRect(bx + 15, groundOffset - 32, 14, 16);
        ctx.fillStyle = cityColor;
        ctx.fillRect(bx + 10, groundOffset - 44, 24, 6);
        ctx.fillRect(bx + 15, groundOffset - 76, 14, 32);
        ctx.fillRect(bx + 14, groundOffset - 81, 16, 5);
        ctx.fillRect(bx + 19, groundOffset - 102, 6, 21);
        ctx.fillRect(bx + 21, groundOffset - 116, 2, 14);
        ctx.fillStyle = isNight ? 'rgba(255, 110, 64, 0.55)' : 'rgba(216, 67, 21, 0.25)';
        ctx.fillRect(bx + 12, groundOffset - 42, 20, 2);
        ctx.fillRect(bx + 16, groundOffset - 79, 12, 2);

      } else if (b.type === 'EMPIRE_STATE') {
        ctx.fillRect(bx + 2, groundOffset - 24, 32, 24);
        ctx.fillRect(bx + 6, groundOffset - 56, 24, 32);
        ctx.fillRect(bx + 9, groundOffset - 88, 18, 32);
        ctx.fillRect(bx + 13, groundOffset - 100, 10, 12);
        ctx.fillRect(bx + 17, groundOffset - 118, 2, 18);
        ctx.fillStyle = accentColor;
        for (let wy = groundOffset - 82; wy < groundOffset - 10; wy += 8) {
          ctx.fillRect(bx + 12, wy, 2, 4);
          ctx.fillRect(bx + 17, wy, 2, 4);
          ctx.fillRect(bx + 22, wy, 2, 4);
        }

      } else if (b.type === 'BIG_BEN') {
        ctx.fillRect(bx + 4, groundOffset - 68, 20, 68);
        ctx.fillRect(bx + 2, groundOffset - 86, 24, 18);
        ctx.fillStyle = isNight ? 'rgba(255, 245, 157, 0.65)' : bgColor;
        ctx.fillRect(bx + 8, groundOffset - 82, 12, 10);
        ctx.fillStyle = cityColor;
        ctx.fillRect(bx + 13, groundOffset - 80, 2, 4);
        ctx.fillRect(bx + 13, groundOffset - 77, 4, 2);
        ctx.fillRect(bx + 6, groundOffset - 94, 16, 8);
        ctx.fillRect(bx + 10, groundOffset - 102, 8, 8);
        ctx.fillRect(bx + 13, groundOffset - 110, 2, 8);

      } else if (b.type === 'SYDNEY_OPERA') {
        ctx.fillRect(bx + 2, groundOffset - 10, 64, 10);
        ctx.fillRect(bx + 8, groundOffset - 22, 22, 12);
        ctx.fillRect(bx + 12, groundOffset - 32, 14, 10);
        ctx.fillRect(bx + 16, groundOffset - 38, 6, 6);
        ctx.fillRect(bx + 28, groundOffset - 20, 20, 10);
        ctx.fillRect(bx + 32, groundOffset - 28, 12, 8);
        ctx.fillRect(bx + 36, groundOffset - 33, 5, 5);
        ctx.fillRect(bx + 46, groundOffset - 17, 16, 7);
        ctx.fillRect(bx + 50, groundOffset - 22, 8, 5);

      } else if (b.type === 'PYRAMIDS') {
        for (let step = 0; step < 9; step++) {
          const w = 48 - step * 5;
          ctx.fillRect(bx + 2 + step * 2.5, groundOffset - (step + 1) * 5, w, 5);
        }
        for (let step = 0; step < 6; step++) {
          const w = 32 - step * 5;
          ctx.fillRect(bx + 42 + step * 2.5, groundOffset - (step + 1) * 5, w, 5);
        }

      } else {
        const by = groundOffset - b.height;
        ctx.fillRect(bx, by, b.width, b.height);

        if (b.hasAntenna) {
          ctx.fillRect(bx + Math.floor(b.width / 2) - 1, by - 10, 2, 10);
        }

        ctx.fillStyle = accentColor;
        b.windows.forEach(win => {
          if (win.lit) {
            const wy = by + 6 + win.row * 10;
            if (wy + 4 < groundOffset - 4) {
              ctx.fillRect(bx + 5, wy, 4, 4);
              if (b.width > 30) {
                ctx.fillRect(bx + b.width - 9, wy, 4, 4);
              }
            }
          }
        });
      }
    });
  }

  function drawCloud(cloud) {
    if (weather === 'RAIN') {
      ctx.fillStyle = '#757575';
    } else {
      ctx.fillStyle = isNight ? 'rgba(232, 234, 237, 0.25)' : '#dcdcdc';
    }
    const cx = Math.floor(cloud.x);
    const cy = Math.floor(cloud.y);
    ctx.fillRect(cx + 12, cy, 16, 4);
    ctx.fillRect(cx + 6, cy + 4, 28, 4);
    ctx.fillRect(cx, cy + 8, 42, 6);
    ctx.fillRect(cx + 4, cy + 14, 34, 3);
  }

  function drawTerrain(themeColor, bgColor) {
    ctx.fillStyle = themeColor;
    ctx.fillRect(0, groundOffset, canvas.width, 2);

    terrainBumps.forEach(bump => {
      const bx = Math.floor(bump.x);
      if (bump.type === 'HILL') {
        ctx.fillStyle = bgColor;
        ctx.fillRect(bx + 2, groundOffset, bump.width - 4, 2);
        ctx.fillStyle = themeColor;
        ctx.fillRect(bx + 2, groundOffset - 2, 4, 2);
        ctx.fillRect(bx + 6, groundOffset - 4, bump.width - 12, 2);
        ctx.fillRect(bx + bump.width - 6, groundOffset - 2, 4, 2);
      } else {
        ctx.fillStyle = bgColor;
        ctx.fillRect(bx + 2, groundOffset, bump.width - 4, 2);
        ctx.fillStyle = themeColor;
        ctx.fillRect(bx + 2, groundOffset + 2, 4, 2);
        ctx.fillRect(bx + 6, groundOffset + 4, bump.width - 12, 2);
        ctx.fillRect(bx + bump.width - 6, groundOffset + 2, 4, 2);
      }
    });

    ctx.fillStyle = themeColor;
    groundDots.forEach(dot => {
      ctx.fillRect(dot.x, dot.y, dot.size, 1);
    });
  }

  // 音效系統
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(freq, type, duration, gainVal = 0.08) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function playJumpSound() { playSound(400, 'square', 0.1); }
  function playHitSound() { playSound(150, 'sawtooth', 0.25); }
  function playScoreSound() { playSound(850, 'sine', 0.15); }
  function playNearMissSound() { playSound(660, 'triangle', 0.12, 0.1); }
  function playAchievementSound() {
    playSound(523, 'square', 0.1, 0.08);
    setTimeout(() => playSound(659, 'square', 0.1, 0.08), 90);
    setTimeout(() => playSound(784, 'square', 0.2, 0.08), 180);
  }

  // ==========================================
  // 恐龍物件（支援 4 種解鎖造型 + 驚訝死法）
  // ==========================================
  let nearMissCombo = 0;

  const dino = {
    x: 50,
    y: 164,
    width: 44,
    height: 46,
    velocityY: 0,
    gravity: 0.65,
    jumpPower: -11.5,
    isGrounded: true,
    isDucking: false,
    legFrame: 0,
    
    draw() {
      const skin = stats.selectedSkin;

      if (skin === 'CYBER') {
        color = isNight ? '#00e5ff' : '#0277bd';
      }

      const isDead = gameState === 'GAMEOVER';
      ctx.fillStyle = color;

      if (this.isDucking && this.isGrounded && !isDead) {
        const dy = 184;
        ctx.fillRect(this.x, dy + 10, 52, 16);
        ctx.fillRect(this.x + 36, dy + 4, 20, 12);
        ctx.fillStyle = bgColor;
        ctx.fillRect(this.x + 50, dy + 6, 2, 2);

        if (skin === 'COOL') {
          ctx.fillStyle = '#111';
          ctx.fillRect(this.x + 48, dy + 5, 8, 4);
        }

        ctx.fillStyle = color;
        if (this.legFrame < 5) {

      } else {

        const dy = this.y;

        ctx.fillRect(dx + 22, dy, 22, 18);
        if (isDead) {
          ctx.fillRect(dx + 26, dy + 14, 16, 3);
        } else {
          ctx.fillRect(dx + 26, dy + 12, 18, 4);
        }

        if (isDead) {
          ctx.fillStyle = bgColor;
          ctx.fillRect(dx + 25, dy + 3, 6, 6);

          ctx.fillRect(dx + 27, dy + 5, 2, 2);
        } else if (skin === 'COOL') {
          ctx.fillStyle = '#111';
          ctx.fillRect(dx + 24, dy + 3, 20, 5);
          ctx.fillStyle = '#fff';
          ctx.fillRect(dx + 27, dy + 4, 2, 2);
        } else if (skin === 'CYBER') {
          ctx.fillStyle = '#ff1744';
          ctx.fillRect(dx + 26, dy + 4, 5, 3);
        } else {

        }

        ctx.fillStyle = color;
        ctx.fillRect(dx + 10, dy + 14, 20, 20);
        ctx.fillRect(dx + 4, dy + 18, 6, 12);
        ctx.fillRect(dx, dy + 22, 4, 6);
        ctx.fillRect(dx + 28, dy + 22, 4, 4);

        if (skin === 'CYBER') {
          ctx.fillStyle = bgColor;
          ctx.fillRect(dx + 14, dy + 18, 10, 2);
          ctx.fillRect(dx + 14, dy + 23, 10, 2);
          ctx.fillStyle = color;
        }

        if (!this.isGrounded || isDead) {
          ctx.fillRect(dx + 12, dy + 34, 4, 10);
          ctx.fillRect(dx + 22, dy + 34, 4, 10);
        } else {
          if (this.legFrame < 5) {
            ctx.fillRect(dx + 12, dy + 34, 4, 12);
            ctx.fillRect(dx + 14, dy + 44, 4, 2);
            ctx.fillRect(dx + 22, dy + 34, 4, 6);
          } else {

      }
    },
    jump() {
      if (this.isGrounded) {
        this.velocityY = this.jumpPower;
        this.isGrounded = false;
        playJumpSound();

        if (weather === 'METEOR_SHOWER' && shootingStars.length > 0) {
          score += 50;
          stats.totalScore += 50;
          playScoreSound();
          spawnFloatingText('🌠 流星許願 +50!', this.x, this.y - 20, '#80d8ff');
        }
      }
    },
    update() {
      if (!this.isGrounded) {
        this.velocityY += this.gravity;
        this.y += this.velocityY;
        if (this.y >= 164) {
          this.y = 164;
          this.velocityY = 0;
          this.isGrounded = true;
        }
      }
      this.legFrame = (this.legFrame + 1) % 10;
    }
  };

  // 障礙物物件與動態繪製
  let obstacles = [];
  function spawnObstacle() {
    const isBird = Math.random() < 0.35 && score > 200;
    if (!isBird) {
      const count = Math.floor(Math.random() * 3) + 1;
      obstacles.push({
        x: canvas.width,
        y: 166,
        width: count * 16 + 6,
        height: 44,
        type: 'CACTUS',
        count: count,
        nearMissChecked: false
      });
    } else {
      const birdY = Math.random() < 0.5 ? 125 : 160;
      obstacles.push({
        x: canvas.width,
        y: birdY,
        width: 38,
        height: 26,
        type: 'BIRD',
        wingFrame: 0,
        nearMissChecked: false
      });
    }
  }

  function drawCactus(obs) {
    ctx.fillStyle = isNight ? '#e8eaed' : '#535353';
    for (let c = 0; c < obs.count; c++) {
      const cx = obs.x + c * 16;
      const cy = obs.y;
      ctx.fillRect(cx + 4, cy, 8, 44);
      ctx.fillRect(cx, cy + 12, 4, 14);
      ctx.fillRect(cx, cy + 22, 8, 4);
      ctx.fillRect(cx + 12, cy + 18, 4, 14);
      ctx.fillRect(cx + 8, cy + 28, 8, 4);

  function drawBird(obs) {
    ctx.fillStyle = isNight ? '#e8eaed' : '#535353';
    const bx = obs.x;
    const by = obs.y;
    ctx.fillRect(bx + 10, by + 10, 20, 10);
    ctx.fillRect(bx, by + 6, 10, 6);
    ctx.fillRect(bx + 30, by + 12, 8, 4);

    obs.wingFrame = (obs.wingFrame + 1) % 12;
    if (obs.wingFrame < 6) {
      ctx.fillRect(bx + 14, by, 6, 10);
      ctx.fillRect(bx + 16, by - 4, 4, 4);
    } else {
      ctx.fillRect(bx + 14, by + 18, 6, 10);

  function drawRestartIcon(x, y, themeColor, bgColor) {
    ctx.fillStyle = themeColor;
    ctx.fillRect(x, y + 2, 34, 26);
    ctx.fillRect(x + 2, y, 30, 30);
    ctx.fillStyle = bgColor;
    ctx.fillRect(x + 3, y + 3, 28, 24);
    ctx.fillStyle = themeColor;
    ctx.fillRect(x + 12, y + 8, 10, 3);
    ctx.fillRect(x + 10, y + 11, 3, 8);
    ctx.fillRect(x + 12, y + 19, 10, 3);
    ctx.fillRect(x + 21, y + 15, 3, 4);
    ctx.fillRect(x + 20, y + 6, 3, 7);

  // Firebase 排行榜數據
  onValue(leaderboardRef, (snapshot) => {
    const data = snapshot.val();
    globalScores = [];
    if (data) {
      Object.keys(data).forEach(key => {
        globalScores.push(data[key]);
      });
      globalScores.sort((a, b) => b.score - a.score);
    }
    updateLeaderboardUI();
    if (globalScores.length > 0) {
      highScore = globalScores[0].score;
    }
  });

  function updateLeaderboardUI() {
    leaderboardList.innerHTML = '';
    const top10 = globalScores.slice(0, 10);
    if (top10.length === 0) {
      leaderboardList.innerHTML = '<li>尚未有紀錄</li>';
      return;
    }
    top10.forEach((item, index) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${index + 1}. ${item.name}</span><span>${String(item.score).padStart(5, '0')}</span>`;
      leaderboardList.appendChild(li);
    });
  }

  function handlePrimaryAction() {
    if (isModalOpen()) return;

    if (gameState === 'PLAYING') {
      dino.jump();
    } else if (gameState === 'START' || gameState === 'GAMEOVER') {
      resetGame();
    }
  }

  window.addEventListener('keydown', (e) => {
    if (isModalOpen()) return;

    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      handlePrimaryAction();
    }
    if (e.code === 'ArrowDown' && gameState === 'PLAYING') {
      dino.isDucking = true;
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowDown') {
      dino.isDucking = false;
    }
  });

  canvas.addEventListener('touchstart', (e) => {
    if (isModalOpen()) return;
    e.preventDefault();
    handlePrimaryAction();
  }, { passive: false });

  canvas.addEventListener('mousedown', (e) => {
    if (isModalOpen()) return;
    if (e.button === 0) {
      handlePrimaryAction();
    }
  });

  function resetGame() {
    score = 0;
    currentSpeed = initialSpeed;
    obstacles = [];
    volcanoMeteors = [];
    shootingStars = [];
    floatingTexts = [];
    nearMissCombo = 0;
    nextLandmarkScore = 100;
    pendingLandmark = false;
    initCityBuildings();
    dino.y = 164;
    dino.velocityY = 0;
    dino.isGrounded = true;
    dino.isDucking = false;
    gameState = 'PLAYING';
    weather = 'CLEAR';
    isNight = false;
    document.body.classList.remove('night', 'meteor-mode');
  }

  function getDinoHitbox(dinoObj) {
    return dinoObj.isDucking && dinoObj.isGrounded
      ? { x: dinoObj.x + 8, y: 196, width: 38, height: 12 }
      : { x: dinoObj.x + 12, y: dinoObj.y + 8, width: 22, height: 32 };
  }

  function checkCollision(dinoObj, obs) {
    const dinoHitbox = getDinoHitbox(dinoObj);
    const obsHitbox = obs.type === 'CACTUS'
      ? { x: obs.x + 5, y: obs.y + 6, width: Math.max(6, obs.width - 10), height: obs.height - 8 }
      : { x: obs.x + 6, y: obs.y + 8, width: obs.width - 12, height: obs.height - 12 };

    return (
      dinoHitbox.x < obsHitbox.x + obsHitbox.width &&
      dinoHitbox.x + dinoHitbox.width > obsHitbox.x &&
      dinoHitbox.y < obsHitbox.y + obsHitbox.height &&
      dinoHitbox.y + dinoHitbox.height > obsHitbox.y
    );
  }

  function checkNearMiss(dinoObj, obs) {
    if (obs.nearMissChecked) return;
    const dinoHitbox = getDinoHitbox(dinoObj);
    if (obs.x + obs.width < dinoHitbox.x) {
      obs.nearMissChecked = true;
      const verticalGap = Math.abs((dinoHitbox.y + dinoHitbox.height) - obs.y);
      if (verticalGap < 26) {
        nearMissCombo++;
        stats.totalNearMiss++;
        const bonus = 20 * Math.min(nearMissCombo, 5);
        score += bonus;
        stats.totalScore += bonus;
        playNearMissSound();
        const label = nearMissCombo > 1 ? `CLOSE x${nearMissCombo}! +${bonus}` : `CLOSE! +${bonus}`;
        spawnFloatingText(label, dinoObj.x + 10, dinoObj.y - 12, '#ff9800');
        checkAchievements(Math.floor(score));
        saveStats();
      } else {
        nearMissCombo = 0;
      }
    }
  }

  function handleGameOver() {
    gameState = 'GAMEOVER';
    playHitSound();

    const currentScoreInt = Math.floor(score);
    checkAchievements(currentScoreInt);
    saveStats();

    const savedName = localStorage.getItem('pixel_runner_username') || '';
    nameInput.value = savedName;

    const isTopScore = globalScores.length < 10 || currentScoreInt > (globalScores[9]?.score || 0);

    if (isTopScore && currentScoreInt > 0) {
      nameModal.style.display = 'block';
      setTimeout(() => nameInput.focus(), 50);
    }
  }

  function submitLeaderboardName() {
    const name = nameInput.value.trim() || '無名氏';
    localStorage.setItem('pixel_runner_username', name);
    const currentScoreInt = Math.floor(score);
    
    const newScoreRef = ref(db, 'leaderboard/' + Date.now());
    set(newScoreRef, {
      name: name,
      score: currentScoreInt
    });

    nameModal.style.display = 'none';
    nameInput.blur();
  }

  submitBtn.addEventListener('click', submitLeaderboardName);
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitLeaderboardName();
    }
  });

  // 主更新邏輯
  function update() {
    frameCount++;

    if (gameState === 'PLAYING') {
      const currentScoreInt = Math.floor(score);
      currentSpeed = Math.min(initialSpeed + currentScoreInt * 0.008, maxSpeed);

      score += 0.15;
      stats.totalScore += 0.15;
      const updatedScoreInt = Math.floor(score);

      // 每突破 100 分里程碑，排入一座世界地標
      if (updatedScoreInt >= nextLandmarkScore) {
        pendingLandmark = true;
        nextLandmarkScore += 100;
      }

      if (updatedScoreInt > 0 && updatedScoreInt % 100 === 0 && Math.floor(score - 0.15) % 100 !== 0) {
        playScoreSound();
        checkAchievements(updatedScoreInt);
      }

      updateWeatherState(updatedScoreInt);
      dino.update();

      // 視差層 1：世界都市地標與建築慢速移動
      cityBuildings.forEach(b => {
        b.x -= currentSpeed * 0.15;
      });
      if (cityBuildings.length > 0 && cityBuildings[0].x + cityBuildings[0].width < -20) {
        const lastB = cityBuildings[cityBuildings.length - 1];
        cityBuildings.shift();
        const nextItem = createCityElement(lastB.x + lastB.width + 10 + Math.floor(Math.random() * 16));
        cityBuildings.push(nextItem);
      }

      // 視差層 2：天空雲朵
      clouds.forEach(cloud => {
        cloud.x -= currentSpeed * 0.25;
        if (cloud.x + 50 < 0) {
          cloud.x = canvas.width + Math.random() * 120;
          cloud.y = 40 + Math.random() * 60;
        }
      });

      // 雷雨天特效更新
      if (weather === 'RAIN') {
        rainDrops.forEach(r => {
          r.x -= 3;
          r.y += r.speed;
          if (r.y > groundOffset) {
            r.y = -10;
            r.x = Math.random() * (canvas.width + 100);
          }
        });
        if (Math.random() < 0.005) {
          lightningAlpha = 0.65;
        }
      }
      if (lightningAlpha > 0) {
        lightningAlpha = Math.max(0, lightningAlpha - 0.05);
      }

      // 流星雨之夜更新
      if (weather === 'METEOR_SHOWER' && Math.random() < 0.015) {
        shootingStars.push({
          x: 300 + Math.random() * 500,
          y: 10 + Math.random() * 40,
          vx: -9 - Math.random() * 4,
          vy: 4 + Math.random() * 2,
          life: 45
        });
      }
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const s = shootingStars[i];
        s.x += s.vx;
        s.y += s.vy;
        s.life--;
        if (s.life <= 0) shootingStars.splice(i, 1);
      }

      // 火山隕石雨更新
      if (weather === 'VOLCANO' && frameCount % 95 === 0 && Math.random() < 0.7) {
        const targetX = 160 + Math.random() * 450;
        volcanoMeteors.push({
          x: targetX + 180,
          y: -20,
          targetX: targetX,
          vx: -3.2,
          vy: 3.8,
          radius: 8
        });
      }
      for (let i = volcanoMeteors.length - 1; i >= 0; i--) {
        const m = volcanoMeteors[i];
        m.x += m.vx;
        m.y += m.vy;

        const dBox = getDinoHitbox(dino);
        if (
          m.x - 5 < dBox.x + dBox.width &&
          m.x + 5 > dBox.x &&
          m.y - 5 < dBox.y + dBox.height &&
          m.y + 5 > dBox.y
        ) {
          handleGameOver();
        }

        if (m.y >= groundOffset) {
          volcanoMeteors.splice(i, 1);
        }
      }

      // 前景起伏地形與地面顆粒
      terrainBumps.forEach(bump => {
        bump.x -= currentSpeed;
        if (bump.x + bump.width < 0) {
          bump.x = canvas.width + Math.random() * 100;
          bump.type = Math.random() > 0.4 ? 'HILL' : 'PIT';
          bump.width = 24 + Math.floor(Math.random() * 16);
        }
      });

      groundDots.forEach(dot => {
        dot.x -= currentSpeed;
        if (dot.x < 0) dot.x = canvas.width;
      });

      // 障礙物生成與更新
      if (frameCount % Math.max(35, Math.floor(110 - currentSpeed * 3)) === 0) {
        if (Math.random() < 0.65) spawnObstacle();
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= currentSpeed;

        if (checkCollision(dino, obstacles[i])) {
          handleGameOver();
        } else {
          checkNearMiss(dino, obstacles[i]);
        }

        if (obstacles[i].x + obstacles[i].width < 0) {
          obstacles.splice(i, 1);
        }
      }
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      floatingTexts[i].y -= 0.8;
      floatingTexts[i].alpha -= 0.02;
      if (floatingTexts[i].alpha <= 0) {
        floatingTexts.splice(i, 1);
      }
    }
  }

  // 主畫面繪製
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const themeColor = isNight ? '#e8eaed' : '#535353';
    const bgColor = weather === 'VOLCANO' ? '#2b1818' : (isNight ? '#202124' : '#f7f7f7');

    if (lightningAlpha > 0) {
      ctx.fillStyle = `rgba(255, 255, 255, ${lightningAlpha})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    if (isNight) {
      ctx.fillStyle = '#e8eaed';
      stars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));
      ctx.fillRect(680, 40, 20, 20);
      ctx.fillStyle = bgColor;
      ctx.fillRect(676, 36, 12, 12);
    }

    shootingStars.forEach(s => {
      ctx.fillStyle = '#80d8ff';
      ctx.fillRect(s.x, s.y, 4, 4);
      ctx.fillStyle = 'rgba(128, 216, 255, 0.45)';
      ctx.fillRect(s.x + 4, s.y - 2, 10, 2);
      ctx.fillRect(s.x + 14, s.y - 4, 12, 2);
    });

    drawCityBackground();
    clouds.forEach(cloud => drawCloud(cloud));

    if (weather === 'RAIN') {
      ctx.fillStyle = isNight ? 'rgba(128, 216, 255, 0.5)' : 'rgba(83, 83, 83, 0.45)';
      rainDrops.forEach(r => {
        ctx.fillRect(r.x, r.y, 1.5, r.len);
      });
    }

    drawTerrain(themeColor, bgColor);

    volcanoMeteors.forEach(m => {
      if (Math.floor(frameCount / 6) % 2 === 0) {
        ctx.fillStyle = '#ff1744';
        ctx.fillRect(m.targetX - 10, groundOffset - 2, 20, 4);
      }
      ctx.fillStyle = '#ff9100';
      ctx.fillRect(m.x + 4, m.y - 8, 8, 8);
      ctx.fillStyle = '#ff1744';
      ctx.fillRect(m.x - 5, m.y - 5, 10, 10);
      ctx.fillStyle = '#ffd54f';
      ctx.fillRect(m.x - 2, m.y - 2, 4, 4);
    });

    dino.draw();
    obstacles.forEach(obs => {
      if (obs.type === 'CACTUS') drawCactus(obs);
      else drawBird(obs);
    });

    floatingTexts.forEach(ft => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.alpha);
      ctx.fillStyle = ft.color;
      ctx.font = 'bold 14px "Courier New", monospace';
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    });

    ctx.fillStyle = themeColor;
    ctx.font = '700 18px "Courier New", monospace';
    const displayScore = String(Math.floor(score)).padStart(5, '0');
    const displayHigh = String(Math.floor(highScore)).padStart(5, '0');
    ctx.fillText(`HI ${displayHigh}  ${displayScore}`, canvas.width - 190, 35);

    ctx.font = 'bold 12px "Courier New", monospace';
    const weatherLabels = {
      CLEAR: '☀️ 晴朗城市',
      RAIN: '⛈️ 像素雷雨',
      METEOR_SHOWER: '☄️ 流星雨之夜',
      VOLCANO: '🌋 火山隕石雨'
    };
    ctx.fillText(weatherLabels[weather], 15, 25);

    ctx.font = '700 18px "Courier New", monospace';
    if (gameState === 'START') {
      ctx.fillText('按下 [Space] 或點擊螢幕開始遊戲', canvas.width / 2 - 175, 110);
    } else if (gameState === 'GAMEOVER') {
      ctx.fillText('G A M E   O V E R', canvas.width / 2 - 100, 95);
      drawRestartIcon(canvas.width / 2 - 17, 112, themeColor, bgColor);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
